<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lettore EPUB</title>
  <link rel="icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3a3a3a">
  <!-- JSZip va caricato PRIMA di epub.js: il build lo tratta come dipendenza esterna.
       Path assoluti: il frontend Flask li serve da static/ (come la versione originale). -->
  <script src="/jszip.min.js"></script>
  <script src="/epub.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html {
      overflow-x: hidden; /* nessuna barra orizzontale */
      max-width: 100vw;
    }
    html, body {
      overscroll-behavior: none; /* niente rubber band / pull-to-refresh sui mobile */
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #2b2b2b;
      color: #eee;
      height: 100vh;   /* fallback per browser senza supporto dvh */
      height: 100dvh;  /* altezza realmente disponibile: segue la barra URL del browser mobile */
      max-width: 100vw; /* il body non deve mai essere più largo dello schermo */
      overflow: hidden; /* body must not scroll: zoom is now on #viewer only */
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #3a3a3a;
      border-bottom: 1px solid #555;
      flex-shrink: 0;
      /* Su mobile i bottoni sono troppi e la toolbar diverrebbe più
         larga del viewport, forzando il browser a espandere la pagina.
         Con overflow:hidden la toolbar rimane entro lo schermo e i
         bottoni in eccesso vengono nascosti (vedi media query sotto). */
      overflow: hidden;
    }
    @media (max-width: 600px) {
      #toolbar {
        gap: 4px;
        padding: 6px 6px;
      }
      #toolbar button, #toolbar select {
        padding: 4px 6px;
        font-size: 12px;
      }
      /* Nasconde i bottoni meno importanti su schermi stretti */
      #toolbar #reloadBtn,
      #toolbar #metaEditBtn,
      #toolbar #buildBtn,
      #toolbar #widthSelect,
      #toolbar #bgYellowBtn,
      #toolbar #bgBlackBtn {
        display: none;
      }
    }
    #toolbar button {
      background: #555;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    #toolbar button:hover { background: #666; }
    #toolbar button:disabled { opacity: .4; cursor: default; }
    #libraryToggle.active { background: #777; }
    #title { flex: 1; text-align: center; font-weight: 600; overflow: hidden;
             white-space: nowrap; text-overflow: ellipsis; }
    #chapter { font-size: 12px; color: #aaa; }
    #filesToggle.active { background: #777; }

    /* Bottoni tema di lettura: sfondo del testo */
    #toolbar #bgYellowBtn { background: #fff9c4; color: #333; }
    #toolbar #bgYellowBtn:hover { background: #ffe68a; }
    #toolbar #bgBlackBtn { background: #0f0f0f; color: #fff; border: 1px solid #666; }
    #toolbar #bgBlackBtn:hover { background: #2a2a2a; }
    #toolbar #bgYellowBtn.active,
    #toolbar #bgBlackBtn.active { outline: 2px solid #fff; outline-offset: -1px; }

    /* Sidebar condivisa (stile) */
    #sidebar, #librarySidebar {
      position: fixed;
      top: 48px;
      left: 0;
      bottom: 0;
      width: 300px;
      max-width: 85vw;
      background: #3a3a3a;
      border-right: 1px solid #555;
      box-shadow: 3px 0 12px rgba(0,0,0,.45);
      transform: translateX(-105%);
      transition: transform .2s ease;
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow: hidden;
    }
    #sidebar.open, #librarySidebar.open { transform: translateX(0); }

    #sidebarHeader {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #555;
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
    }
    #sidebarHeader span { flex: 1; }
    #sidebarClose, #libraryClose {
      background: none;
      border: none;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
    }
    #sidebarClose:hover, #libraryClose:hover { color: #fff; }

    /* Libreria */
    #bookList {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      touch-action: pan-y; /* la sidebar scrolla ancora col dito */
    }
    .bookItem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      background: #444;
      cursor: pointer;
      font-size: 14px;
      color: #ddd;
    }
    .bookItem:hover { background: #4d4d4d; }
    .bookItem.active { background: #5a7fb0; color: #fff; }
    .bookIcon { font-size: 18px; flex-shrink: 0; }
    .bookInfo { flex: 1; min-width: 0; }
    .bookTitle {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-weight: 600;
    }
    .bookSize {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .bookItem.active .bookSize { color: #dce6f5; }

    /* Browser del pacchetto EPUB */
    #fileList {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      touch-action: pan-y; /* la sidebar scrolla ancora col dito */
    }
    .fileGroup { margin-bottom: 12px; }
    .fileGroup h4 {
      margin: 6px 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #999;
    }
    .fileItem {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 13px;
      word-break: break-all;
      cursor: default;
      color: #ddd;
    }
    .fileItem.spine { cursor: pointer; }
    .fileItem.spine:hover { background: #444; }
    .fileItem.active { background: #5a7fb0; color: #fff; }
    .fileIcon { font-size: 15px; flex-shrink: 0; }

    /* Tab bar */
    #tabs {
      display: flex;
      gap: 4px;
      padding: 6px 12px 0;
      background: #2f2f2f;
      border-bottom: 1px solid #444;
      flex-shrink: 0;
      overflow: hidden;
    }
    #tabs .tab {
      background: #3f3f3f;
      color: #ccc;
      border: 1px solid #444;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 7px 18px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 1;
      min-width: 0;
      white-space: nowrap;
    }
    #tabs .tab:hover { background: #4a4a4a; color: #fff; }
    #tabs .tab.active {
      background: #fafafa;
      color: #222;
      border-color: #fafafa;
    }
    #tabs .tab:disabled { opacity: .4; cursor: default; }
    #tabs .tab.actionBtn {
      background: #3f3f2c;
      border-color: #5d5d33;
    }
    #tabs .tab.actionBtn:hover { background: #55553a; }

    #viewer {
      flex: 1;
      margin: 0 auto;
      max-width: 900px;
      width: 100%;
      background: #fafafa;
      box-shadow: 0 0 30px rgba(0,0,0,.5);
      overflow: hidden;
      touch-action: none;
    }

    /* Editor HTML */
    #editorPanel {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      background: #1e1e1e;
      border-top: 1px solid #444;
    }
    #editorHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #2c2c2c;
      border-bottom: 1px solid #444;
      flex-shrink: 0;
    }
    #editorHeader span {
      flex: 1;
      font-family: Consolas, monospace;
      font-size: 12px;
      color: #aaa;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #editorHeader button {
      background: #555;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    #editorHeader button:hover { background: #666; }
    #editorHeader button:disabled { opacity: .4; cursor: default; }
    #editorHeader #saveBtn { background: #3d7a3d; }
    #editorHeader #saveBtn:hover { background: #4a8f4a; }
    #editorHeader #saveBtn:disabled { background: #555; }
    #codeEditor {
      flex: 1;
      min-height: 0;
      border: none;
      outline: none;
      resize: none;
      padding: 12px;
      background: #1e1e1e;
      color: #dcdcdc;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }

    .epub-container {
      touch-action: none;
      box-sizing: border-box;
      padding: 3% 3%; /* margine attorno all'area di lettura; epub.js sottrae il padding del container dalla size */
    }

    /* ZOOM: CSS zoom is applied ONLY to #viewer (not :root), so the browser
       chrome (toolbar, tabs, sidebar, etc.) stays at zoom 1 and never overflows
       the viewport.  The old approach zoomed :root and counter-rotated chrome
       elements with zoom:1/Z — that caused body (height:100dvh) to grow
       beyond the viewport on zoom-in.  By zooming #viewer directly, the flex
       layout and body dimensions are unaffected; #viewer uses overflow:auto
       so zoomed content can be scrolled.  epub.js measures container CSS px
       (clientWidth/offsetWidth), which are NOT affected by CSS zoom on the
       element itself, so pagination stays correct. */

    /* SCALA UI DEL POPOVER DI EDITING (--ui-scale):
       il popover #inlineEditor non vive dentro #viewer, quindi lo zoom A+/A−
       non lo tocca e i suoi font fissi in px restavano piccoli quando si
       legge/edita a zoom alto. Soluzione: i font e le dimensioni di base del
       popover sono definiti come calc(Npx * var(--ui-scale)) e applyZoom()
       aggiorna --ui-scale insieme a viewer.style.zoom. Così editor e testo
       di lettura scalano SEMPRE insieme con lo stesso fattore.
       Nota sullo zoom del BROWSER (rotellina): quello scala da sé tutti i
       pixel CSS dell'intera pagina (popover compreso, anche senza questa
       variabile). I due zoom si compongono moltiplicandosi:
         font effettivo = Npx * --ui-scale [A+/A−] * fattore browser
       Il posizionamento resta corretto perché le coordinate usate da
       positionInlineEditor (getBoundingClientRect, window.innerWidth)
       sono già espresse in pixel CSS scalati dal browser zoom. */
    :root { --ui-scale: 1; } /* fattore di scala del popover, pilotato da applyZoom() */

    /* Popover editing in-context (paragrafo cliccato nel viewer) */
    #inlineEditor {
      display: none;
      position: fixed;
      z-index: 1000;
      /* Dimensioni di base scalate con la UI: a zoom alto il box cresce
         insieme ai font (offsetWidth/Height usati dal clamp in JS leggono
         comunque il valore renderizzato, quindi restano corretti). */
      width: calc(500px * var(--ui-scale));
      max-width: 92vw;
      min-width: min(360px, 92vw);
      min-height: calc(240px * var(--ui-scale));
      overflow: hidden;
      background: #262626;
      border: 1px solid #666;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0,0,0,.55);
      flex-direction: column;
      font-size: calc(15px * var(--ui-scale));
    }
    #inlineEditor.open { display: flex; }
    /* Maniglia per spostare il popover (comodo su touch, senza mouse) */
    #ieHandle {
      flex-shrink: 0;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2f2f2f;
      color: #9a9a9a;
      font-size: calc(13px * var(--ui-scale));
      letter-spacing: 5px;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;   /* niente pan/scroll: il gesto sposta il popover */
      border-bottom: 1px solid #555;
      border-radius: 8px 8px 0 0;
    }
    #ieHandle:active { cursor: grabbing; color: #ddd; }
    .ieHead {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 3px 10px;
      background: #2f2f2f;
      border-bottom: 1px solid #555;
      border-radius: 0;
      touch-action: none;
      cursor: grab;
    }
    .ieHead:active { cursor: grabbing; }
    .ieHead span {
      flex: 1;
      font-family: Consolas, monospace;
      font-size: calc(15px * var(--ui-scale));
      color: #bbb;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .ieHead button {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: calc(12px * var(--ui-scale));
      padding: 4px 4px;
    }
    .ieHead button:hover { color: #fff; }
    .ieModeBtn { border: 1px solid #666 !important; border-radius: 4px; padding: 2px 6px !important; }
    .ieModeBtn.active { background: #5a7fb0; color: #fff; }
    #ieCode {
      width: 100%;
      flex: 1 1 auto;
      min-height: 160px;
      max-height: 60vh;
      border: none;
      outline: none;
      resize: none;
      padding: 12px;
      background: #1e1e1e;
      color: #dcdcdc;
      font-family: Consolas, 'Courier New', monospace;
      /* Stessa dimensione e interlinea della vista frammento (textarea.ieFrag):
         le due modalità del popover devono avere font identici */
      font-size: calc(13px * var(--ui-scale));
      line-height: 1.45;
      tab-size: 2;
      white-space: pre-wrap;   /* testo a capo invece dello scroll orizzontale */
      overflow-wrap: break-word;
      word-break: break-word;
      overflow: auto;
    }
    /* Grip per il ridimensionamento manuale (in basso a destra): zona
       generosa per il touch, touch-action: none così il gesto non viene
       interpretato dal browser come scroll/pan */
    #ieGrip {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 48px;
      height: 48px;
      cursor: nwse-resize;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      border-bottom-right-radius: 7px;
      background:
        linear-gradient(135deg, transparent 50%, #bdbdbd 50%) 24px 24px / 36px 36px no-repeat,
        linear-gradient(135deg, transparent 50%, #7a7a7a 50%) 12px 12px / 36px 36px no-repeat;
    }
    #ieGrip:hover,
    #ieGrip:active {
      background:
        linear-gradient(135deg, transparent 50%, #e0e0e0 50%) 24px 24px / 36px 36px no-repeat,
        linear-gradient(135deg, transparent 50%, #a0a0a0 50%) 12px 12px / 36px 36px no-repeat;
    }
    /* Frammenti di testo del paragrafo: un campo editabile per nodo testo.
       La struttura HTML (<em>, <strong>, attributi…) non e' esposta: si
       modificano solo i nodi testo, quindi al salvataggio nulla del markup
       puo' rompersi. */
    #ieFrags {
      flex: 1 1 auto;
      min-height: 120px;
      max-height: 60vh;
      overflow: auto;
      padding: 8px 10px;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .fragItem {
      display: flex;
      gap: 6px;
      align-items: stretch;
    }
    .fragIdx {
      flex-shrink: 0;
      min-width: calc(34px * var(--ui-scale));
      color: #7a7a7a;
      font-size: calc(10px * var(--ui-scale));
      font-family: Consolas, monospace;
      text-align: right;
      padding-top: 6px;
      white-space: nowrap;
      user-select: none;
    }
    textarea.ieFrag {
      flex: 1;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
      outline: none;
      resize: vertical;
      padding: 5px 7px;
      background: #161616;
      color: #dcdcdc;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: calc(13px * var(--ui-scale));
      line-height: 1.45;
      overflow-wrap: break-word;
      word-break: break-word;
      overflow: auto;
    }
    textarea.ieFrag:focus { border-color: #c9a86a; }
    .ieFoot {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 4px 4px;
      border-top: 1px solid #555;
    }
    .ieHint {
      flex-shrink: 0;
      padding: 6px 14px;
      border-top: 1px solid #444;
      background: #2a2a2a;
      color: #9a9a9a;
      font-size: calc(12px * var(--ui-scale));
      line-height: 1.5;
      user-select: text;
    }
    .ieHint b { color: #c9a86a; font-weight: normal; }
    .ieFoot button {
      background: #555;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 3px 3px;
      cursor: pointer;
      font-size: calc(10px * var(--ui-scale));
    }
    .ieFoot button:hover { background: #666; }
    .ieFoot button:disabled { opacity: .4; cursor: default; }
    #ieSave { background: #3d7a3d; }
    #ieCancel { background: #D3D3D3;color:black }
    #ieSave:hover { background: #4a8f4a; }
    #ieCancel:hover { background: white; }
    #ieSave:disabled { background: #555; }

    /* Editor metadati OPF (solo libri da cartella): modale centrato */
    #metaEditor {
      display: none;
      position: fixed;
      z-index: 1100;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 680px;
      max-width: 94vw;
      height: 72vh;
      min-height: 320px;
      flex-direction: column;
      background: #262626;
      border: 1px solid #666;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0,0,0,.55);
      overflow: hidden;
      font-size: 14px;
    }
    #metaEditor.open { display: flex; }
    .metaHead {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #2f2f2f;
      border-bottom: 1px solid #555;
      flex-shrink: 0;
    }
    .metaHead span {
      flex: 1;
      font-weight: 600;
      font-size: 14px;
      color: #ddd;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .metaHead button {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 17px;
      padding: 0 4px;
    }
    .metaHead button:hover { color: #fff; }
    #metaCode {
      flex: 1;
      min-height: 0;
      border: none;
      outline: none;
      resize: none;
      padding: 12px;
      background: #1e1e1e;
      color: #dcdcdc;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }
    .metaFoot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-top: 1px solid #555;
      flex-shrink: 0;
    }
    .metaFoot #metaPath {
      flex: 1;
      font-size: 11px;
      color: #888;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .metaFoot button {
      background: #555;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 14px;
    }
    .metaFoot button:hover { background: #666; }
    .metaFoot button:disabled { opacity: .4; cursor: default; }
    #metaSave { background: #3d7a3d; }
    #metaSave:hover { background: #4a8f4a; }
    #metaSave:disabled { background: #555; }

    /* Report costruzione EPUB (modale centrato) */
    #buildReport {
      display: none;
      position: fixed;
      z-index: 1150;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 660px;
      max-width: 94vw;
      max-height: 82vh;
      flex-direction: column;
      background: #262626;
      border: 1px solid #666;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0,0,0,.55);
      overflow: hidden;
      font-size: 13px;
    }
    #buildReport.open { display: flex; }
    #buildReportText {
      flex: 1;
      min-height: 180px;
      max-height: 62vh;
      overflow: auto;
      padding: 12px 14px;
      margin: 0;
      background: #1e1e1e;
      color: #dcdcdc;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre;
    }

    #status {
      position: fixed;
      top: 55px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.8); color: #fff;
      padding: 8px 16px; border-radius: 6px;
      font-size: 13px; display: none; z-index: 10;
    }

  </style>
</head>
<body>
  <div id="status">Caricamento...</div>

  <div id="toolbar">
    <button id="libraryToggle" title="Libreria">📚</button>
    <button id="filesToggle" title="File inclusi nell'EPUB">📂</button>
    <button id="prev" title="Pagina precedente" disabled style="width:4rem;font-size:1.2rem">‹</button>
    <button id="next" title="Pagina successiva" disabled style="width:4rem;font-size:1.2rem">›</button>
     <button id="zoomOut" title="Riduci zoom (contenuto di lettura)" disabled>A−</button>
    <button id="zoomReset" title="Reimposta zoom al 100%" disabled>100%</button>
    <button id="zoomIn" title="Aumenta zoom (contenuto di lettura)" disabled>A+</button> 
    <button id="spreadToggle" disabled>Una pagina</button>
    <button id="reloadBtn" title="Ricarica il capitolo corrente dal disco (libri da cartella: mostra la traduzione salvata dal translator)" disabled>⟳ Ricarica</button>
    <button id="metaEditBtn" title="Modifica i metadati dell'EPUB (solo libri da cartella)" disabled>⚙ Metadati</button>
    <button id="buildBtn" title="Assembla un EPUB ben formato dalla cartella tradotta (come build_epub.py): mimetype non compresso, fallback sul tedesco per i capitoli non tradotti, dc:language -> it" disabled>📦 Crea EPUB</button>
    <select id="widthSelect" title="Larghezza massima pagina">
    <option value="30">30%</option>
    <option value="35">35%</option>
      <option value="40">40%</option>
      <option value="45">45%</option>
      <option value="50">50%</option>
      <option value="60">60%</option>
      <option value="70">70%</option>
      <option value="80">80%</option>
      <option value="90" selected>90%</option>
      <option value="100">100%</option>
    </select>
    <button id="bgYellowBtn" title="Sfondo giallo pallido per il testo" disabled>Giallo</button>
    <button id="bgBlackBtn" title="Sfondo nero con testo bianco" disabled>Nero</button>
    <span id="title">Lettore EPUB</span>
    <span id="chapter"></span>
  </div>

  <!-- Tab: lettura / modifica HTML -->
  <div id="tabs">
    <button id="tabView" class="tab active">📖 Lettura</button>
    <button id="tabEdit" class="tab" disabled>✏️ Modifica HTML</button>
    <button id="tabEditSel" class="tab actionBtn"
      title="Mostra l'editor in-context per il paragrafo appena cliccato nel lettore (clicca prima sul paragrafo)">✏️ Paragrafo selezionato</button>
  </div>

  <div id="viewer"></div>

  <!-- Pannello editor HTML del capitolo corrente -->
  <div id="editorPanel">
    <div id="editorHeader">
      <span id="editorFile"></span>
      <button id="reloadEditor" title="Ricarica dal file">↻</button>
      <button id="saveBtn" title="Salva nel file .epub">💾 Salva</button>
    </div>
    <textarea id="codeEditor" spellcheck="false" wrap="off"
      placeholder="Apri un capitolo e seleziona la tab 'Modifica HTML' per vederne il codice."></textarea>
  </div>

  <!-- Popover fluttuante: editing in-context del paragrafo cliccato -->
  <div id="inlineEditor" aria-hidden="true">
    <div id="ieHandle" title="Trascina per spostare">☰ ☰ ☰</div>
    <div class="ieHead">
      <span id="ieTitle">Modifica paragrafo</span>
       <button id="ieModeFrag" class="ieModeBtn" title="Modifica solo il frammento di testo cliccato">Frammento</button>
       <button id="ieModeFull" class="ieModeBtn" title="Modifica l'intero paragrafo (HTML)">Intero</button>
       <button id="ieSave">💾 Salva</button>
       <button id="ieCancel">Annulla</button>
      <button id="ieClose" title="Chiudi (Esc)">✕</button>
    </div>
    <div id="ieFrags"></div>
    <textarea id="ieCode" spellcheck="false" style="display:none"></textarea>
    <!--<div class="ieHint">Un elemento per riga: es. <b>&lt;p&gt;prima parte&lt;/p&gt;&lt;p&gt;seconda parte&lt;/p&gt;</b></div>-->
    <div class="ieFoot">
      <!--<button id="ieCancel">Annulla</button>
      <button id="ieSave">💾 Salva</button>-->
      <span>&nbsp;&nbsp;</span>
    </div>
    <div id="ieGrip" title="Ridimensiona"></div>
  </div>

  <!-- Editor metadati OPF (libri da cartella) -->
  <div id="metaEditor" aria-hidden="true">
    <div class="metaHead">
      <span>Metadati EPUB (content.opf)</span>
      <button id="metaClose" title="Chiudi (Esc)">✕</button>
    </div>
    <textarea id="metaCode" spellcheck="false" wrap="off"
      placeholder="XML del package (OPF) con i metadati dell'EPUB…"></textarea>
    <div class="metaFoot">
      <span id="metaPath"></span>
      <button id="metaCancel">Annulla</button>
      <button id="metaSave">💾 Salva</button>
    </div>
  </div>

  <!-- Report costruzione EPUB (port di build_epub.py) -->
  <div id="buildReport" aria-hidden="true">
    <div class="metaHead">
      <span>Report costruzione EPUB</span>
      <button id="buildReportClose" title="Chiudi (Esc)">✕</button>
    </div>
    <pre id="buildReportText"></pre>
    <div class="metaFoot">
      <button id="buildReportOk">OK</button>
    </div>
  </div>

  <!-- Sidebar sinistra: libreria (scelta del libro) -->
  <aside id="librarySidebar" aria-hidden="true">
    <div id="sidebarHeader">
      <span>Libreria</span>
      <button id="libraryClose" title="Chiudi">✕</button>
    </div>
    <div id="bookList"></div>
  </aside>

  <!-- Sidebar sinistra: file del pacchetto EPUB -->
  <aside id="sidebar" aria-hidden="true">
    <div id="sidebarHeader">
      <span>File dell'EPUB</span>
      <button id="sidebarClose" title="Chiudi">✕</button>
    </div>
    <div id="fileList"></div>
  </aside>

  <script>
    var book = null;
    var rendition = null;
    var spreadOn = true; // doppia pagina affiancata (default)
    var fileEls = {};    // href -> elemento riga nella sidebar
    var currentBookUrl = null;
    var currentHref = null;   // href del capitolo visualizzato (per l'editor)
    var viewer = document.getElementById("viewer");
    var statusEl = document.getElementById("status");
    var bookListEl = document.getElementById("bookList");
    var librarySidebar = document.getElementById("librarySidebar");
    // --- API Flask ⟷ JavaScript ---
    // listBooks() → GET /api/books (elenco: prima l'epub da cartella su /ext/,
    //   output del translator, poi i .epub in static/)
    // saveChapter(payload) → POST /api/save_chapter (salva la voce modificata
    //   nell'epub, o nel file della cartella esterna; "silent" è accettato per
    //   compatibilità con il frontend condiviso, non ha effetti lato server:
    //   il ri-render è client-side)
    // setZoom removed: CSS zoom now targets #viewer only (see applyZoom()).
    window.api = {};

    function apiListBooks() {
      return fetch("/api/books").then(function (r) { return r.json(); });
    }
    function apiSaveChapter(payload) {
      return fetch("/api/save_chapter", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function (r) { return r.json(); });
    }
    function apiBuildEpub() {
      return fetch("/api/build_epub", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(null)
      }).then(function (r) { return r.json(); });
    }

    // ZOOM NOTE: api.setZoom was removed.  CSS zoom is now applied directly
    // to #viewer (not documentElement), so the browser chrome is never zoomed
    // and the viewport dimensions stay stable.  See applyZoom() below.

    function setStatus(msg) {
      statusEl.textContent = msg;
      statusEl.style.display = msg ? "block" : "none";
    }

    // --- Libreria: sidebar sinistra ---
    function openLibrary() {
      librarySidebar.classList.add("open");
      document.getElementById("libraryToggle").classList.add("active");
      // aprendo la libreria chiudi l'eventuale browser dei file
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("filesToggle").classList.remove("active");
    }
    function closeLibrary() {
      librarySidebar.classList.remove("open");
      document.getElementById("libraryToggle").classList.remove("active");
    }
    document.getElementById("libraryToggle").addEventListener("click", function () {
      if (librarySidebar.classList.contains("open")) closeLibrary();
      else openLibrary();
    });
    document.getElementById("libraryClose").addEventListener("click", closeLibrary);

    function highlightCurrentBook() {
      var items = bookListEl.querySelectorAll(".bookItem");
      for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle("active", items[i].dataset.url === currentBookUrl);
      }
    }

    function formatSize(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + " KB";
      return bytes + " B";
    }

    function loadBookList() {
      apiListBooks()
        .then(function (books) {
          bookListEl.innerHTML = "";
          if (!books || !books.length) {
            var empty = document.createElement("div");
            empty.textContent = "Nessun libro trovato: metti dei file .epub in static/";
            empty.style.cssText = "color:#999;font-size:13px;padding:8px;";
            bookListEl.appendChild(empty);
            return;
          }
          books.forEach(function (b) {
            var row = document.createElement("div");
            row.className = "bookItem";
            row.dataset.url = b.url;
            row.addEventListener("click", function () {
              if (b.url !== currentBookUrl) openBook(b.url);
              closeLibrary(); // chiudi la libreria dopo la scelta
            });
            var icon = document.createElement("span");
            icon.className = "bookIcon";
            icon.textContent = "📖";
            var info = document.createElement("span");
            info.className = "bookInfo";
            var t = document.createElement("span");
            t.className = "bookTitle";
            t.textContent = b.title;
            var s = document.createElement("span");
            s.className = "bookSize";
            s.textContent = formatSize(b.size) + " · " + b.name;
            info.appendChild(t);
            info.appendChild(s);
            row.appendChild(icon);
            row.appendChild(info);
            bookListEl.appendChild(row);
          });
          // evidenzia il libro attualmente aperto
          highlightCurrentBook();
          // apre il primo libro della libreria all'avvio
          openBook(books[0].url);
        })
        .catch(function (err) {
          setStatus("Errore nel caricamento della libreria: " + err);
        });
    }

    // --- Lettura ---
    // Un libro "da cartella" è l'epub NON impacchettato servito su /ext/
    // (es. l'output del translator): i file vengono riletti dal disco a ogni
    // richiesta, così le traduzioni salvate si vedono in tempo reale.
    function isFolderBook() {
      if (!currentBookUrl) return false;
      // Flask: URL inizia con "/ext/" (server). Standalone Nim: virtual host
      // https://ext/ (la cartella del translator mappata da miowv).
      if (currentBookUrl.indexOf("/ext/") === 0) return true;
      try {
        var a = document.createElement("a");
        a.href = currentBookUrl;
        return a.hostname === "ext";
      } catch (e) { return false; }
    }

    // Chiave libro per il salvataggio: per il libro-cartella il backend (Nim
    // e Flask) riconosce la chiave "ext"; per i .epub il basename.
    function bookKey() {
      if (isFolderBook()) return "ext";
      // Toglie l'eventuale origine (es. https://books/): il backend si aspetta
      // solo il nome del file .epub relativo a gBooksDir.
      return currentBookUrl.replace(/^https?:\/\/[^/]+/i, "").replace(/^\//, "");
    }

    // --- Posizione di lettura (~/.epubreader/positions.json lato server) ---
    // Su ogni cambio pagina ('relocated', con debounce) salviamo CFI + href
    // del libro corrente; all'apertura ripristiniamo la posizione salvata
    // con fallback graduato: CFI -> href del capitolo -> inizio libro.
    var posSaveTimer = null;
    var posReady = false; // false finche' il ripristino non e' completato:
                          // evita che il 'relocated' della display() iniziale
                          // sovrascriva la posizione salvata con la pagina 1.

    function savePositionNow() {
      if (!book || !rendition || !currentBookUrl) return;
      var loc;
      try { loc = rendition.currentLocation(); } catch (e) { return; }
      if (!loc || !loc.start) return;
      var payload = {
        book: bookKey(),
        cfi: (loc.start.cfi || "") + "",
        href: loc.start.href || "",
        anchor: "",
        page: loc.start.displayed && loc.start.displayed.page ? loc.start.displayed.page : null,
        totalPages: loc.start.displayed && loc.start.displayed.total ? loc.start.displayed.total : null
      };
      fetch("/api/save_position", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(function () {});
    }

    function savePositionSoon() {
      if (!posReady) return; // niente salvataggi prima del ripristino
      if (posSaveTimer) clearTimeout(posSaveTimer);
      posSaveTimer = setTimeout(savePositionNow, 1200);
    }

    function restoreSavedPosition() {
      var key = bookKey();
      if (!key) { posReady = true; return Promise.resolve(); }
      return fetch("/api/get_position?book=" + encodeURIComponent(key))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var p = d && d.position;
          if (!p || (!p.cfi && !p.href)) return;
          var target = p.cfi || p.href;
          return rendition.display(target).catch(function () {
            // Il CFI non risolve (capitoli modificati/rinumerati): proviamo
            // il capitolo; se fallisce restiamo all'inizio del libro.
            if (p.cfi && p.href) return rendition.display(p.href);
          }).catch(function () {});
        })
        .catch(function () {})
        .then(function () { posReady = true; });
    }

    // Rete di sicurezza alla chiusura: sendBeacon e' affidabile durante lo
    // scaricamento della pagina anche se il debounce non e' ancora scaduto.
    window.addEventListener("beforeunload", function () {
      if (!posReady || !book || !rendition) return;
      try {
        var loc = rendition.currentLocation();
        if (!loc || !loc.start) return;
        var payload = JSON.stringify({
          book: bookKey(),
          cfi: (loc.start.cfi || "") + "",
          href: loc.start.href || "",
          anchor: ""
        });
        navigator.sendBeacon("/api/save_position",
          new Blob([payload], { type: "application/json" }));
      } catch (e) {}
    });

    // Percorso della voce dentro l'epub (zip: voce dell'archivio; cartella:
    // percorso relativo alla radice del pacchetto, senza il prefisso /ext/).
    function chapterArchPath(section, href) {
      return normalizeExtPath((section && section.url) || href);
    }

    // epub.js per i libri da cartella usa URL ASSOLUTI per section.url
    // (es. "http://host/ext/OEBPS/x.xhtml"): li normalizza nel percorso
    // relativo al pacchetto ("OEBPS/x.xhtml") accettando anche input
    // relativi o già senza prefisso.
    function normalizeExtPath(p) {
      p = String(p || "");
      p = p.replace(/^https?:\/\/[^/]+/i, ""); // toglie l'origine
      p = p.replace(/^\//, "");                 // toglie lo slash iniziale
      if (isFolderBook()) {
        var base = currentBookUrl.replace(/^\//, ""); // es. "ext/"
        if (base && p.indexOf(base) === 0) p = p.slice(base.length);
      }
      return p;
    }

    // Per i libri da cartella epub.js NON crea l'archive (legge via HTTP):
    // installiamo uno shim così l'editor HTML, i patch e buildEditedChapter
    // funzionano come per i .epub. Le richieste escono dalla cache-buster e
    // dal Cache-Control: no-store del server, quindi leggono SEMPRE dal disco.
    function installArchiveShim() {
      if (!book || book.archive) return;
      function shimType(url) {
        var m = /\.([a-z0-9]+)(\?.*)?$/i.exec(String(url));
        return m ? m[1].toLowerCase() : "";
      }
      function shimHandle(text, type) {
        if (type === "json") return JSON.parse(text);
        if (type === "xhtml") return new DOMParser().parseFromString(text, "application/xhtml+xml");
        if (type === "html" || type === "htm") return new DOMParser().parseFromString(text, "text/html");
        if (type === "xml" || type === "opf" || type === "ncx" || type === "svg")
          return new DOMParser().parseFromString(text, "text/xml");
        return text;
      }
      // Legge SEMPRE dal disco: cache-buster (t=) + Cache-Control: no-store.
      // In Flask è il server a mandare no-store; qui il virtual host WebView2
      // può cacheare i file, quindi la t= unica forza la rilettura a ogni
      // richiesta (le traduzioni salvate dal translator si vedono subito).
      function fetchFresh(path) {
        var sep = path.indexOf("?") >= 0 ? "&" : "?";
        var reqUrl = currentBookUrl + path + sep + "raw=1&t=" + Date.now();
        return fetch(reqUrl, { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        });
      }
      book.archive = {
        request: function (url, type) {
          return fetchFresh(normalizeExtPath(url)).then(function (text) {
            return shimHandle(text, type || shimType(url));
          });
        },
        // L'archive shim non possiede risorse reali (niente zip/urlCache),
        // quindi il destroy e' un no-op. MA il metodo DEVE esistere:
        // Book.destroy() chiama archive.destroy() e senza questo metodo il
        // destroy del libro da cartella fallisce a meta' (spine gia' azzerato,
        // resto intatto): la variabile globale book resterebbe agganciata a
        // un libro mezzo distrutto, e il destroy successivo crasha su
        // spine.spineItems.forEach (spineItems ormai undefined).
        destroy: function () {}
      };
      // book.request è quello che epub.js usa per il RENDERING (Book.load →
      // manager → section.load): gli XHTML vengono parsati in Document come
      // utils_request (il tipo viene dedotto dall'estensione). Le risorse
      // non-HTML passano intatte.
      book.request = function (url, type) {
        var path = normalizeExtPath(url);
        return fetchFresh(path).then(function (text) {
          return shimHandle(text, type || shimType(url));
        });
      };
    }

    // Rilevamento mobile: touch + schermo stretto = dispositivo mobile/tablet.
    // Usato all'avvio per applicare automaticamente vista a pagina singola e zoom 200%.
    function isMobileDevice() {
      var hasTouch = navigator.maxTouchPoints > 0;
      var narrowScreen = window.matchMedia("(max-width: 1024px)").matches;
      var smallScreen = window.matchMedia("(max-height: 600px)").matches;
      return hasTouch && (narrowScreen || smallScreen);
    }

    function openBook(url) {
      closeInlineEditor(); // il popover in-context appartiene al libro precedente
      closeMetaEditor();  // idem per l'editor dei metadati
      closeBuildReport(); // e per il report di costruzione EPUB
      if (book) {
        try {
          book.destroy();
        } catch (err) {
          // Il destroy e' fallito a meta' (es. libro da cartella in stato
          // anomalo): book viene comunque sostituito qui sotto da ePub(url),
          // cosi' un oggetto mezzo distrutto non puo' essere distrutto una
          // seconda volta (che farebbe crashare spine.each su spineItems
          // ormai undefined).
        }
      }
      currentBookUrl = url.split("?")[0]; // toglie l'eventuale cache-buster
      currentHref = null;
      setStatus("Apertura del libro…");

      book = ePub(url);
      // Libro da cartella: shim dell'archive (editor HTML, patch, ricarica)
      // e pulsante "Ricarica" abilitato.
      if (isFolderBook()) installArchiveShim();
      document.getElementById("reloadBtn").disabled = !isFolderBook();
      document.getElementById("metaEditBtn").disabled = !isFolderBook();
      document.getElementById("buildBtn").disabled = !isFolderBook();
      rendition = book.renderTo("viewer", {
        width: "100%",
        height: "100%",
        flow: "paginated"
      });
      // Tema di lettura (sfondo del testo): il content hook viene eseguito a
      // ogni render di capitolo, così il tema scelto resta applicato anche
      // dopo cambi pagina / salvataggi. Il container della pagina madre viene
      // colorato subito: renderTo crea il div .epub-container in modo sincrono.
      rendition.hooks.content.register(injectBgTheme);
      applyBgToContainers();

      // Ad ogni render (apertura libro, cambio capitolo, resize) prepara
      // l'editing in-context sul documento del capitolo (popover al click).
      rendition.on("rendered", function () {
        var contents = rendition.getContents();
        if (contents) contents.forEach(function (c) {
          if (c && c.document) bindInlineEdit(c); // prepara il popover in-context al click (invisibile)
        });
      });

      // Swipe orizzontale per girare pagina. Gli eventi touch arrivano dai
      // documenti interni degli iframe tramite passEvents di epub.js, quindi
      // lo swipe funziona anche sopra al testo. Chiama la stessa navigate()
      // dei bottoni prev/next (stessa guardia anti doppio-gesto): i bottoni
      // continuano a funzionare e i gesti lenti (selezione testo) o verticali
      // vengono ignorati. Nota: epub.js riceve questi eventi come "passive",
      // quindi non facciamo preventDefault: dopo uno swipe vero Chrome non
      // genera comunque il click, quindi non si apre l'editor in-context.
      var swipeStartX = null, swipeStartY = null, swipeStartT = 0;
      rendition.on("touchstart", function (e) {
        if (!e.touches || e.touches.length !== 1) { swipeStartX = null; return; }
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
        swipeStartT = performance.now();
      });
      rendition.on("touchend", function (e) {
        if (swipeStartX == null) return;
        var t = e.changedTouches && e.changedTouches[0];
        if (!t) { swipeStartX = null; return; }
        var dx = t.clientX - swipeStartX;
        var dy = t.clientY - swipeStartY;
        var dt = performance.now() - swipeStartT;
        swipeStartX = null;
        if (dt > 800 || dt < 30) return;              // gesto lento (selezione testo) o troppo corto
        if (Math.abs(dx) < 60) return;                // distanza minima per considerarlo uno swipe
        if (Math.abs(dx) < Math.abs(dy) * 1.5) return; // deve essere nettamente orizzontale
        // Stessa logica dei bottoni: rispetta i bordi del libro
        if (dx < 0 && !document.getElementById("next").disabled) navigate(1);
        else if (dx > 0 && !document.getElementById("prev").disabled) navigate(-1);
      });

      // Prima riapriamo il libro all'inizio (cosi' i metadati e la TOC sono
      // pronti), poi ripristiniamo la posizione salvata per QUESTO libro.
      rendition.display().then(function () {
        setStatus("");
        return restoreSavedPosition();
      }).then(function () {
        document.getElementById("prev").disabled = false;
        document.getElementById("next").disabled = false;
        document.getElementById("spreadToggle").disabled = false;
        document.getElementById("filesToggle").disabled = false;
        document.getElementById("tabEdit").disabled = false;
        document.getElementById("zoomOut").disabled = false;
        document.getElementById("zoomReset").disabled = false;
        document.getElementById("zoomIn").disabled = false;
        document.getElementById("bgYellowBtn").disabled = false;
        document.getElementById("bgBlackBtn").disabled = false;
        var title = book.packaging.metadata.title;
        if (title) document.getElementById("title").textContent = title;
        try {
          buildFileList();
        } catch (err) {
          document.getElementById("fileList").textContent =
            "Errore: " + err.message;
        }
        highlightCurrentBook();

        // Configurazione automatica per dispositivi mobile:
        // singola pagina per una lettura comoda su schermi piccoli.
        if (isMobileDevice()) {
          spreadOn = false;
          rendition.spread("none");
          document.getElementById("spreadToggle").textContent = "Due pagine";
          applyZoom(1);
        }
      });

      rendition.on("relocated", function (location) {
        // Salva la posizione (con debounce): ogni libro ricorda la sua pagina
        savePositionSoon();
        var label = "";
        if (location.start && location.start.href) {
          var nav = book.navigation.get(location.start.href);
          if (nav) label = nav.label;
        }
        document.getElementById("chapter").textContent = label;

        // Aggiorna il capitolo corrente (usato dall'editor HTML)
        currentHref = location.start && location.start.href ? location.start.href : null;
        // Se cambia capitolo chiudi il popover di editing in-context
        if (inlineEditor.classList.contains("open") && inlineCtx) {
          var curHref = currentHref ? currentHref.split("#")[0] : null;
          if (!curHref || curHref !== (inlineCtx.href || "").split("#")[0]) closeInlineEditor();
        }
        var editorPanel = document.getElementById("editorPanel");
        if (getComputedStyle(editorPanel).display !== "none") loadEditorContent();

        // Evidenzia il file attivo nella sidebar (browser del pacchetto)
        for (var h in fileEls) fileEls[h].classList.remove("active");
        if (location.start && location.start.href && fileEls[location.start.href]) {
          fileEls[location.start.href].classList.add("active");
          fileEls[location.start.href].scrollIntoView({ block: "nearest" });
        }
        // Stato pulsanti: disabilita ai bordi del libro (prev all'inizio,
        // next alla fine) così il click non "sembra" rotto.
        document.getElementById("prev").disabled = !!location.atStart;
        document.getElementById("next").disabled = !!location.atEnd;
      });
    }

    // Navigazione pagine: delegata a epub.js, che gestisce da solo lo scroll
    // tra le colonne e il passaggio tra i capitoli. Guardia anti doppio-click
    // e feedback degli errori al posto del fallimento silenzioso.
    var lastNavAt = 0;
    function navigate(dir) {
      if (!rendition) return;
      var now = performance.now();
      if (now - lastNavAt < 200) return; // ignora i doppio-click
      lastNavAt = now;
      var p = dir < 0 ? rendition.prev() : rendition.next();
      if (p && typeof p.catch === "function") {
        p.catch(function (err) { setStatus("Errore di navigazione: " + err); });
      }
    }
    document.getElementById("prev").addEventListener("click", function () { navigate(-1); });
    document.getElementById("next").addEventListener("click", function () { navigate(1); });

    // Toggle pagina singola / doppia pagina affiancata
    document.getElementById("spreadToggle").addEventListener("click", function () {
      if (!rendition) return;
      spreadOn = !spreadOn;
      rendition.spread(spreadOn ? "auto" : "none");
      document.getElementById("spreadToggle").textContent =
        spreadOn ? "Una pagina" : "Due pagine";
    });

    // ZOOM: CSS zoom applied directly to #viewer only (not :root).
    // This keeps the browser chrome (toolbar, tabs, sidebar) at normal size
    // and avoids viewport overflow.  epub.js measures container CSS px via
    // clientWidth/offsetWidth, which are NOT scaled by CSS zoom on the
    // element itself, so column pagination remains correct.
    // #viewer has overflow:auto, so zoomed content that exceeds the box
    // can be scrolled.
    var readerZoom = 1, ZOOM_MIN = 0.75, ZOOM_MAX = 2, ZOOM_STEP = 0.25;
    function applyZoom(z) {
      if (!rendition) return;
      z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
      readerZoom = z;
      // Apply zoom to the viewer element only — the rest of the page is untouched.
      viewer.style.zoom = z;
      document.getElementById("zoomReset").textContent = Math.round(z * 100) + "%";
      // SCALA UI DEL POPOVER: aggiorna --ui-scale così i font e le dimensioni
      // di base di #inlineEditor (calc(Npx * var(--ui-scale))) scalano con lo
      // stesso fattore del testo di lettura (vedi commento CSS a inizio file).
      // Lo zoom del BROWSER si applica da sopra e i due fattori si moltiplicano.
      document.documentElement.style.setProperty("--ui-scale", z);
      // Popover già aperto: riposizionala/ridimensiona coi clamp aggiornati
      // (positionInlineEditor legge offsetWidth/Height, ormai già scalati).
      if (inlineCtx && inlineEditor.classList.contains("open")) {
        positionInlineEditor(inlineCtx.px, inlineCtx.py);
      }
      // Wait one frame for CSS zoom to take effect, then tell epub.js to
      // re-measure and reflow columns (same as a window resize).
      requestAnimationFrame(function () {
        if (rendition) rendition.resize();
      });
    }
    document.getElementById("zoomOut").addEventListener("click", function () { applyZoom(readerZoom - ZOOM_STEP); });
    document.getElementById("zoomReset").addEventListener("click", function () { applyZoom(1); });
    document.getElementById("zoomIn").addEventListener("click", function () { applyZoom(readerZoom + ZOOM_STEP); });

    // --- Tema di lettura: sfondo del testo (giallo pallido / nero con testo bianco) ---
    var bgThemes = {
      bgYellow: "html, body { background-color: #fff9c4 !important; color: #1a1a1a !important; }",
      bgBlack: "html { background-color: #000 !important; } " +
               "body { background-color: #000 !important; color: #fff !important; } " +
               "body * { color: #fff !important; } " +
               "a { color: #9ecbff !important; }"
    };
    var bgThemeName = null; // "bgYellow" | "bgBlack" | null = nessun tema
    // Colore di sfondo del container nella pagina madre: il div .epub-container
    // ha un padding attorno all'area di lettura, che senza questo colore
    // mostrava una cornice bianca attorno al tema scelto.
    var bgThemeBg = { bgYellow: "#fff9c4", bgBlack: "#000" };

    // Content hook di epub.js: eseguito su OGNI render di capitolo, mantiene
    // il foglio di stile del tema attivo dentro il documento dell'iframe.
    function injectBgTheme(contents) {
      var doc = contents && contents.document;
      if (!doc || !doc.head) return;
      var id = "app-bg-theme";
      var el = doc.getElementById(id);
      if (!el) {
        el = doc.createElement("style");
        el.id = id;
        doc.head.appendChild(el);
      }
      el.textContent = bgThemeName ? bgThemes[bgThemeName] : "";
    }

    // Applica il tema scelto; un secondo click sullo stesso bottone torna al normale.
    // Colora (o ripristina) anche il container di epub.js nella pagina madre: il
    // div .epub-container (id epubjs-container-...) ha un padding attorno
    // all'area di lettura, che senza questo sfondo mostrava una cornice bianca.
    function applyBgToContainers() {
      var color = bgThemeName ? bgThemeBg[bgThemeName] : "";
      var containers = document.querySelectorAll(".epub-container");
      for (var i = 0; i < containers.length; i++) {
        containers[i].style.backgroundColor = color;
      }
    }

    function setBgTheme(name) {
      if (bgThemeName === name) name = null; // toggle off
      bgThemeName = name;
      document.getElementById("bgYellowBtn").classList.toggle("active", bgThemeName === "bgYellow");
      document.getElementById("bgBlackBtn").classList.toggle("active", bgThemeName === "bgBlack");
      applyBgToContainers();
      if (rendition) {
        var contents = rendition.getContents();
        if (contents) contents.forEach(injectBgTheme);
      }
    }
    document.getElementById("bgYellowBtn").addEventListener("click", function () { setBgTheme("bgYellow"); });
    document.getElementById("bgBlackBtn").addEventListener("click", function () { setBgTheme("bgBlack"); });

    // Ricarica il capitolo corrente dal disco (solo libri da cartella): la
    // traduzione salvata dal translator si vede senza riaprire il libro.
    function reloadCurrentChapter() {
      if (!book || !rendition || !currentHref) {
        setStatus("Nessun capitolo da ricaricare.");
        return;
      }
      var section = book.spine ? book.spine.get(currentHref) : null;
      if (!section) { setStatus("Nessun capitolo da ricaricare."); return; }
      var archPath = chapterArchPath(section, currentHref);
      var fetchPath = normalizeExtPath(currentHref.split("#")[0]); // relativo al pacchetto
      var reqUrl = currentBookUrl + fetchPath + "?raw=1&t=" + Date.now();
      setStatus("Ricaricamento del capitolo…");
      fetch(reqUrl, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      }).then(function (text) {
        // aggiorna l'archive-shim (e i suoi patch) e la cache della sezione
        if (book.archive) patchArchiveForChapter(archPath, text);
        if (section) {
          section.contents = undefined;
          section.document = undefined;
          section.output = undefined;
        }
        // se l'editor HTML è aperto, mostra il testo appena letto
        var editorPanel = document.getElementById("editorPanel");
        if (getComputedStyle(editorPanel).display !== "none") {
          document.getElementById("codeEditor").value = text;
        }
        rendition.clear();
        rendition.display(currentHref).catch(function () {});
        setStatus("Capitolo ricaricato dal disco ✓");
      }).catch(function (err) {
        setStatus("Errore nel ricaricamento: " + (err && err.message ? err.message : err));
      });
    }
    document.getElementById("reloadBtn").addEventListener("click", reloadCurrentChapter);

    // ==================================================================
    // Editor metadati OPF (solo libri da cartella)
    // ==================================================================
    // Il libro da cartella è un epub NON impacchettato: i metadati vivono
    // nell'OPF (content.opf, individuato dal full-path del rootfile in
    // META-INF/container.xml). Questo editor li legge e li salva direttamente
    // su disco con lo stesso apiSaveChapter dei capitoli (backend:
    // saveChapterIntoFolder, chiave "ext").
    var metaEditor = document.getElementById("metaEditor");
    var metaCode = document.getElementById("metaCode");
    var metaSave = document.getElementById("metaSave");
    var metaPathEl = document.getElementById("metaPath");
    var metaOpfPath = null; // percorso OPF in modifica (relativo al pacchetto)

    // Estrae il titolo (<dc:title>) da un OPF per aggiornare toolbar/libreria
    function metaTitleFromOpf(text) {
      try {
        var doc = new DOMParser().parseFromString(text, "text/xml");
        if (doc.getElementsByTagName("parsererror").length) return "";
        var el = doc.getElementsByTagName("dc:title")[0]
              || doc.getElementsByTagNameNS("http://purl.org/dc/elements/1.1/", "title")[0];
        if (!el) {
          // fallback: qualsiasi <title> dentro <metadata>
          var metas = doc.getElementsByTagName("metadata");
          if (metas.length) {
            var kids = metas[0].getElementsByTagName("*");
            for (var i = 0; i < kids.length; i++) {
              if ((kids[i].localName || kids[i].tagName).toLowerCase() === "title") {
                el = kids[i];
                break;
              }
            }
          }
        }
        return el ? (el.textContent || "").trim() : "";
      } catch (e) { return ""; }
    }

    // Percorso dell'OPF nel pacchetto: full-path del rootfile in
    // META-INF/container.xml (già parsato da epub.js; fallback: rilettura).
    function resolveOpfPath() {
      if (book && book.container && book.container.packagePath) {
        return Promise.resolve(book.container.packagePath);
      }
      var contUrl = currentBookUrl + "META-INF/container.xml?raw=1&t=" + Date.now();
      return fetch(contUrl, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      }).then(function (text) {
        var doc = new DOMParser().parseFromString(text, "text/xml");
        var rf = doc.getElementsByTagName("rootfile")[0];
        if (!rf) throw new Error("container.xml senza rootfile");
        var fp = rf.getAttribute("full-path");
        if (!fp) throw new Error("rootfile senza full-path");
        return fp;
      });
    }

    function openMetaEditor() {
      if (!isFolderBook() || !currentBookUrl) return;
      setStatus("Caricamento dei metadati…");
      resolveOpfPath().then(function (opfPath) {
        metaOpfPath = String(opfPath).replace(/^\//, "");
        var sep = metaOpfPath.indexOf("?") >= 0 ? "&" : "?";
        var reqUrl = currentBookUrl + metaOpfPath + sep + "raw=1&t=" + Date.now();
        return fetch(reqUrl, { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        });
      }).then(function (text) {
        metaCode.value = text;
        metaPathEl.textContent = "Modifica: " + metaOpfPath;
        metaSave.disabled = false;
        metaEditor.classList.add("open");
        metaEditor.setAttribute("aria-hidden", "false");
        metaCode.focus();
        setStatus("");
      }).catch(function (err) {
        setStatus("Errore nel caricamento dei metadati: " +
          (err && err.message ? err.message : err));
      });
    }

    function closeMetaEditor() {
      metaEditor.classList.remove("open");
      metaEditor.setAttribute("aria-hidden", "true");
      if (document.activeElement === metaCode) metaCode.blur();
      metaOpfPath = null;
    }

    document.getElementById("metaEditBtn").addEventListener("click", openMetaEditor);

    // ==================================================================
    // Costruzione EPUB da cartella (port di build_epub.py)
    // ==================================================================
    // Il bottone "Crea EPUB" lancia la routine Flask equivalente a
    // build_epub.py: assembla un EPUB ben formato (mimetype STORED per
    // primo, fallback sul sorgente tedesco per i capitoli non tradotti,
    // dc:language -> it) e scrive <cartella-target>.epub accanto al target.
    var buildReport = document.getElementById("buildReport");
    var buildReportText = document.getElementById("buildReportText");

    function showBuildReport(res) {
      var lines = [];
      lines.push("=== FILE NELL'EPUB ===");
      (res.files || []).forEach(function (f) {
        var note = f.note ? "  — " + f.note : "";
        lines.push("  " + (note ? "⚠ " : "  ") + f.name +
          "  (" + formatSize(f.size) + ")" + note);
      });
      lines.push("");
      lines.push("=== RIEPILOGO ===");
      lines.push("File inclusi ............ " + res.fileCount);
      lines.push("  capitoli dal target ... " + res.capTarget);
      lines.push("  capitoli in fallback ... " + res.capFallback + " (tedesco)");
      lines.push("Dimensione ............. " + formatSize(res.size));
      lines.push("Output ................. " + res.output);
      if (res.problems && res.problems.length) {
        lines.push("");
        lines.push("=== PROBLEMI RILEVATI ===");
        res.problems.forEach(function (p) { lines.push("  ✗ " + p); });
      } else {
        lines.push("");
        lines.push("✅ EPUB valido: " + res.output);
      }
      buildReportText.textContent = lines.join("\n");
      buildReport.classList.add("open");
      buildReport.setAttribute("aria-hidden", "false");
    }

    function closeBuildReport() {
      buildReport.classList.remove("open");
      buildReport.setAttribute("aria-hidden", "true");
    }

    document.getElementById("buildReportClose").addEventListener("click", closeBuildReport);
    document.getElementById("buildReportOk").addEventListener("click", closeBuildReport);

    document.getElementById("buildBtn").addEventListener("click", function () {
      var btn = document.getElementById("buildBtn");
      btn.disabled = true;
      setStatus("Costruzione dell'EPUB in corso…");
      apiBuildEpub().then(function (res) {
        btn.disabled = !isFolderBook();
        if (res && res.ok) {
          setStatus("EPUB creato ✓ (" + res.output + ")");
        } else if (res && res.error) {
          setStatus("Errore nella costruzione: " + res.error);
        } else {
          setStatus("Costruzione terminata: vedi il report.");
        }
        showBuildReport(res || {});
      }).catch(function (err) {
        btn.disabled = !isFolderBook();
        setStatus("Errore del server: " + err);
      });
    });
    document.getElementById("metaClose").addEventListener("click", closeMetaEditor);
    document.getElementById("metaCancel").addEventListener("click", closeMetaEditor);

    metaSave.addEventListener("click", function () {
      if (!metaOpfPath) return;
      var content = metaCode.value;
      // Validazione leggera: l'OPF deve restare XML ben formato
      var xdoc = new DOMParser().parseFromString(content, "text/xml");
      if (xdoc.getElementsByTagName("parsererror").length) {
        setStatus("XML non valido: correggi la sintassi prima di salvare.");
        return;
      }
      metaSave.disabled = true;
      apiSaveChapter({
        book: bookKey(),
        href: metaOpfPath,
        content: content
      }).then(function (res) {
        if (res && res.ok) {
          // Aggiorna titolo in toolbar e nella riga della libreria; il resto
          // dei metadati (nav, copertina…) si applica riaprendo il libro.
          var t = metaTitleFromOpf(content);
          if (t) {
            document.getElementById("title").textContent = t;
            var rows = bookListEl.querySelectorAll(".bookItem");
            for (var i = 0; i < rows.length; i++) {
              if (rows[i].dataset.url === currentBookUrl) {
                rows[i].querySelector(".bookTitle").textContent = t;
              }
            }
          }
          closeMetaEditor();
          setStatus("Metadati salvati nella cartella ✓ (riapri il libro per applicarli al lettore)");
        } else {
          metaSave.disabled = false;
          setStatus("Errore nel salvataggio: " + ((res && res.error) || "sconosciuto"));
        }
      }).catch(function (err) {
        metaSave.disabled = false;
        setStatus("Errore del server: " + err);
      });
    });

    // Sidebar: toggle on/off del browser del pacchetto EPUB
    document.getElementById("filesToggle").addEventListener("click", function () {
      var sb = document.getElementById("sidebar");
      if (sb.classList.contains("open")) {
        sb.classList.remove("open");
        this.classList.remove("active");
      } else {
        sb.classList.add("open");
        this.classList.add("active");
        closeLibrary(); // aprendo i file chiudi la libreria
      }
    });
    document.getElementById("sidebarClose").addEventListener("click", function () {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("filesToggle").classList.remove("active");
    });

    function buildFileList() {
      fileEls = {};
      var list = document.getElementById("fileList");
      list.innerHTML = "";

      var spine = {};
      book.spine.each(function (s) { spine[s.href] = s; });

      var manifest = book.packaging.manifest || {};
      var items = Object.keys(manifest).map(function (id) {
        var m = manifest[id];
        return { id: id, href: m.href, type: m.type };
      });

      if (!items.length) {
        var empty = document.createElement("div");
        empty.textContent = "Nessun file nel manifest.";
        empty.style.cssText = "color:#999;font-size:13px;padding:8px;";
        list.appendChild(empty);
        return;
      }

      function addGroup(label, icon, match) {
        var groupItems = items.filter(function (it) { return match(it.type); });
        if (!groupItems.length) return;
        groupItems.sort(function (a, b) {
          return a.href.localeCompare(b.href);
        });
        var group = document.createElement("div");
        group.className = "fileGroup";
        var h = document.createElement("h4");
        h.textContent = label;
        group.appendChild(h);
        groupItems.forEach(function (it) {
          var row = document.createElement("div");
          row.className = "fileItem";
          var inSpine = !!spine[it.href];
          if (inSpine) {
            row.classList.add("spine");
            row.title = "Apri nel lettore";
            row.addEventListener("click", (function (href) {
              return function () { if (rendition) rendition.display(href); };
            })(it.href));
          } else {
            row.title = "File di supporto (fuori dal flusso di lettura)";
          }
          var ic = document.createElement("span");
          ic.className = "fileIcon";
          ic.textContent = icon;
          row.appendChild(ic);
          row.appendChild(document.createTextNode(it.href));
          group.appendChild(row);
          fileEls[it.href] = row;
        });
        list.appendChild(group);
      }

      addGroup("Documenti", "📄", function (t) {
        return t === "application/xhtml+xml" || t === "text/html";
      });
      addGroup("Stili", "🎨", function (t) { return t === "text/css"; });
      addGroup("Immagini", "🖼️", function (t) { return t.indexOf("image/") === 0; });
      addGroup("Font", "🔤", function (t) {
        return t.indexOf("font/") === 0 || t.indexOf("application/font") === 0 ||
               t === "application/vnd.ms-opentype" || t === "application/vnd.ms-fontobject";
      });
      addGroup("Script", "⚙️", function (t) {
        return t === "application/javascript" || t === "text/javascript" ||
               t === "application/x-javascript";
      });
      addGroup("Audio/Video", "🎬", function (t) {
        return t.indexOf("audio/") === 0 || t.indexOf("video/") === 0;
      });
      addGroup("Altri file", "🗂️", function (t) {
        return !(t === "application/xhtml+xml" || t === "text/html" ||
                 t === "text/css" || t.indexOf("image/") === 0 ||
                 t.indexOf("font/") === 0 || t.indexOf("application/font") === 0 ||
                 t === "application/vnd.ms-opentype" || t === "application/vnd.ms-fontobject" ||
                 t === "application/javascript" || t === "text/javascript" ||
                 t === "application/x-javascript" ||
                 t.indexOf("audio/") === 0 || t.indexOf("video/") === 0);
      });
    }
    viewer.style.maxWidth = document.getElementById("widthSelect").value + "%";
    document.getElementById("widthSelect").addEventListener("change", function () {
      viewer.style.maxWidth = this.value + "%";
      if (rendition) rendition.resize(); // ri-calcola il layout della pagina
    });

    // Ridimensiona la pagina quando cambia la viewport (rotazione, barra URL mobile…)
    window.addEventListener("resize", function () {
      if (rendition) rendition.resize();
    });

    // --- Padding / colonne: lasciate interamente a epub.js (vedi openBook) ---

    // Tastiera: frecce per navigare, Esc per chiudere le sidebar / popover
    document.addEventListener("keydown", function (e) {
      // Dentro gli editor (full-chapter o popover in-context) le frecce
      // muovono il cursore, non sfogliano
      var t = e.target;
      var isFrag = t && t.classList && t.classList.contains("ieFrag");
      var isEditor = isFrag ||
        (t && (t.id === "codeEditor" || t.id === "ieCode" || t.id === "metaCode"));
      if (isEditor) {
        if (e.key === "Escape") {
          if (isFrag || t.id === "ieCode") closeInlineEditor();
          else if (t.id === "metaCode") closeMetaEditor();
          else showTab("view");
        }
        return;
      }
      if (e.key === "ArrowRight") navigate(1);
      else if (e.key === "ArrowLeft") navigate(-1);
      else if (e.key === "Escape") {
        if (inlineEditor.classList.contains("open")) { closeInlineEditor(); return; }
        if (metaEditor.classList.contains("open")) { closeMetaEditor(); return; }
        if (buildReport.classList.contains("open")) { closeBuildReport(); return; }
        closeLibrary();
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("filesToggle").classList.remove("active");
      }
    });

    // --- Tab: lettura / modifica HTML ---
    function showTab(which) {
      closeInlineEditor(); // il popover in-context vive solo nel viewer
      closeMetaEditor();   // l'editor metadati è un modale: si chiude al cambio tab
      var viewTab = document.getElementById("tabView");
      var editTab = document.getElementById("tabEdit");
      var editorPanel = document.getElementById("editorPanel");
      if (which === "edit") {
        viewTab.classList.remove("active");
        editTab.classList.add("active");
        viewer.style.display = "none";
        editorPanel.style.display = "flex";
        loadEditorContent();
      } else {
        editTab.classList.remove("active");
        viewTab.classList.add("active");
        editorPanel.style.display = "none";
        viewer.style.display = "block";
        if (rendition) {
          // Se un salvataggio e' avvenuto col viewer nascosto, il ri-render
          // e' stato rimandato (flag impostato da updateChapterDom): forza un
          // refresh pulito invece del resize, che sarebbe
          // no-op con dimensioni invariate e lascerebbe l'iframe 0x0
          // (pagina bianca).
          if (window._epubNeedsRefresh) {
            window._epubNeedsRefresh = false;
            var loc = rendition.currentLocation ? rendition.currentLocation() : null;
            var target = (loc && loc.start && loc.start.cfi) || window.currentHref;
            rendition.clear();
            rendition.display(target).catch(function () {
              rendition.display(window.currentHref).catch(function () {});
            });
          } else {
            rendition.resize(); // ricalcola il layout paginato
          }
        }
      }
    }

    function loadEditorContent() {
      var fileLabel = document.getElementById("editorFile");
      var ta = document.getElementById("codeEditor");
      if (!book || !book.archive) {
        ta.value = "";
        fileLabel.textContent = "Nessun libro aperto.";
        return;
      }
      if (!currentHref) {
        ta.value = "";
        fileLabel.textContent = "Nessun capitolo selezionato: apri un capitolo nella tab Lettura.";
        return;
      }
      // Il percorso da usare con l'archive è quello assoluto dentro l'epub,
      // ricavato dalla sezione dello spine (l'href può essere relativo al package).
      var section = book.spine ? book.spine.get(currentHref) : null;
      var src = section && section.url ? section.url : currentHref;
      fileLabel.textContent = "Modifica: " + src;
      ta.value = "Caricamento…";
      book.archive.request(src, "text").then(function (text) {
        ta.value = text;
      }).catch(function (err) {
        ta.value = "";
        fileLabel.textContent = "Errore nel caricamento del file.";
      });
    }

    document.getElementById("tabView").addEventListener("click", function () {
      showTab("view");
    });
    document.getElementById("tabEdit").addEventListener("click", function () {
      showTab("edit");
    });
    // Rende visibile il popover in-context preparato dal click sul paragrafo
    document.getElementById("tabEditSel").addEventListener("click", function () {
      if (!inlineCtx) {
        setStatus("Clicca prima su un paragrafo nel libro, poi ripremi questo bottone.");
        return;
      }
      inlineEditor.setAttribute("aria-hidden", "false");
      inlineEditor.classList.add("open");
      positionInlineEditor(inlineCtx.px, inlineCtx.py); // ri-clampa con dimensioni reali
      focusInlineField();
      autoGrowVisibleFrags(); // il popover ora e' visibile: adatta l'altezza
      setStatus("");
    });
    document.getElementById("reloadEditor").addEventListener("click", loadEditorContent);

    // Salva il codice HTML modificato dentro il file .epub e aggiorna il DOM
    // senza ricaricare l'epub: il backend Flask salva su disco, poi
    // updateChapterDom() ri-renderizza il capitolo corrente (o rimanda il
    // ri-render alla tab Lettura se il viewer è nascosto).
    document.getElementById("saveBtn").addEventListener("click", function () {
      if (!book || !currentHref) return;
      var btn = document.getElementById("saveBtn");
      var content = document.getElementById("codeEditor").value;
      // Percorso assoluto dentro l'epub (quello che matcha le voci dello zip,
      // o il percorso relativo al pacchetto per i libri da cartella)
      var section = book.spine ? book.spine.get(currentHref) : null;
      var archPath = chapterArchPath(section, currentHref);
      btn.disabled = true;
      apiSaveChapter({
        book: bookKey(),
        href: archPath,
        content: content
      }).then(function (res) {
        btn.disabled = false;
        if (res && res.ok) {
          setStatus(isFolderBook()
            ? "Modifiche salvate nella cartella ✓"
            : "Modifiche salvate nel file .epub ✓");
          updateChapterDom(); // ri-render del capitolo corrente
        } else {
          setStatus("Errore nel salvataggio: " + ((res && res.error) || "sconosciuto"));
        }
      }).catch(function (err) {
        btn.disabled = false;
        setStatus("Errore del server: " + err);
      });
    });

    // Ri-renderizza il capitolo corrente nel viewer senza ricaricare l'epub:
    // patcha l'archive di epub.js in memoria (la richiesta del capitolo salvato
    // restituisce il nuovo contenuto) e invalida le cache di sezione/view.
    // (equivalente di updateChapterDomJs in epub_app.nim, ma eseguito lato client)
    function updateChapterDom() {
      if (!book || !book.archive || !rendition) return;
      var section = book.spine ? book.spine.get(currentHref) : null;
      if (!section) return;
      var archPath = chapterArchPath(section, currentHref);
      var newText = document.getElementById('codeEditor').value;
      var archive = book.archive;
      var origRequest = archive.request.bind(archive);
      // 1) Patch dell'archive in memoria: la richiesta del capitolo salvato
      //    restituisce il nuovo contenuto invece di rileggerlo dall'epub.
      archive.request = function (url, type) {
        var p = window.decodeURIComponent(String(url).substr(1));
        if (p === archPath) {
          if (!type) {
            var m = /\.([a-z0-9]+)$/i.exec(String(url));
            type = m ? m[1].toLowerCase() : '';
          }
          try {
            return Promise.resolve(archive.handleResponse(newText, type));
          } catch (e) {
            return Promise.resolve(newText);
          }
        }
        return origRequest(url, type);
      };
      // 2) Invalida le cache della sezione e dei view, cosi' il re-render
      //    rilegge il contenuto aggiornato.
      section.contents = undefined;
      section.document = undefined;
      section.output = undefined;
      var views = rendition.manager.views.all();
      for (var i = 0; i < views.length; i++) {
        if (views[i].section && views[i].section.index === section.index) {
          views[i].displayed = false;
        }
      }
      // 3) Ri-renderizza il capitolo corrente nel viewer. Se il viewer e'
      //    nascosto (tab Modifica HTML) il ri-render produrrebbe un iframe 0x0
      //    e la pagina di lettura resterebbe bianca: in quel caso il ri-render
      //    viene rimandato al ritorno sulla tab Lettura (showTab legge il flag
      //    window._epubNeedsRefresh).
      var viewerEl = document.getElementById('viewer');
      if (viewerEl && viewerEl.style.display === 'none') {
        window._epubNeedsRefresh = true;
      } else {
        rendition.display(currentHref);
      }
    }

    // ==================================================================
    // Editing in-context: clic su un paragrafo nel rendering epub.js
    // ==================================================================
    // Il capitolo vive in un iframe (documento XHTML): i click non risalgono
    // alla pagina madre, quindi li catturiamo sul documento di ogni Contents
    // di epub.js (via rendition.getContents() nel hook "rendered"). Per il
    // paragrafo cliccato generiamo un CFI con section.cfiFromElement: dopo il
    // salvataggio ri-renderizziamo il capitolo dall'archive patchato e
    // riposizioniamo il viewer sul paragrafo con rendition.display(cfi).
    var inlineEditor = document.getElementById("inlineEditor");
    var ieCode = document.getElementById("ieCode");
    var ieFrags = document.getElementById("ieFrags");
    var ieSave = document.getElementById("ieSave");
    var ieCancel = document.getElementById("ieCancel");
    var ieClose = document.getElementById("ieClose");
    var inlineBoundDocs = new WeakSet(); // documenti iframe gia' collegati
    var inlineCtx = null;                // { doc, element, section, href, archPath, cfi, px, py }

    var INLINE_BLOCK_RE = /^(p|div|h[1-6]|li|blockquote|pre|section|article|figure|figcaption|table|tr|td|th|ul|ol|dl|dd|dt|aside|header|footer|main|address|center)$/i;

    // Dal target del click risale al blocco piu' interno editabile
    function inlineBlockFrom(target) {
      var el = target;
      for (var i = 0; el && i < 8; i++) {
        if (el.nodeType !== 1) { el = el.parentNode; continue; }
        var tag = (el.localName || el.tagName || "").toLowerCase();
        if (tag === "body" || tag === "html") return null;
        if (INLINE_BLOCK_RE.test(tag)) {
          // Ignora il wrapper che contiene l'intero capitolo
          // (unico figlio element del body): meglio usare la tab Modifica HTML
          if ((tag === "div" || tag === "section" || tag === "article") &&
              el.parentNode && el.parentNode === el.ownerDocument.body &&
              el.parentNode.children.length <= 1) {
            return null;
          }
          return el;
        }
        el = el.parentNode;
      }
      return null;
    }

    function iframeForDoc(doc) {
      try {
        var fe = doc.defaultView && doc.defaultView.frameElement;
        if (fe) return fe;
      } catch (e) { /* fallback sotto */ }
      if (rendition && rendition.manager) {
        var views = rendition.manager.views.all();
        for (var i = 0; i < views.length; i++) {
          var v = views[i];
          if (v.contents && v.contents.document === doc && v.iframe) return v.iframe;
        }
      }
      return null;
    }

    // Al click su un blocco PREPARA il popover in-context (resta invisibile);
    // il bottone "Paragrafo selezionato" lo rende visibile. Il click non
    // interferisce con la selezione del testo.
    function bindInlineEdit(contents) {
