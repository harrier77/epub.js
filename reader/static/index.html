      var doc = contents && contents.document;
      if (!doc || inlineBoundDocs.has(doc)) return;
      inlineBoundDocs.add(doc);
      // Su mobile la selezione viene collassata PRIMA dell'evento click (e il
      // menu nativo Copia/Cerca/Traduci puo' intercettare il gesto): salviamo
      // l'ultimo Range non collassato su TUTTI gli eventi che precedono il
      // collassamento, cosi' il popover puo' mostrare solo il frammento anche
      // se al momento del click la selezione e' gia' vuota.
      function snapshotSel() {
        try {
          var s = doc.getSelection();
          if (s && s.rangeCount && !s.isCollapsed) {
            doc.__lastSelRange = s.getRangeAt(0).cloneRange();
          }
        } catch (e) {}
      }
      ["selectionchange", "pointerdown", "pointerup", "touchstart", "touchend", "mouseup"].forEach(function (t) {
        doc.addEventListener(t, snapshotSel, true);
      });
      doc.addEventListener("click", function (e) {
        if (e.button && e.button !== 0) return;              // solo click sinistro
        // Popover aperto: i click nel libro NON devono chiuderlo ne' sostituire
        // il paragrafo in modifica (perderesti le modifiche in corso). Si esce
        // solo con Annulla / ✕ / Esc / Salva. I link continuano a navigare (li
        // gestisce epub.js); se il capitolo cambia, "relocated" chiude il popover.
        if (inlineEditor.classList.contains("open")) return;
        var t = e.target;
        if (t && t.closest && t.closest("a")) { closeInlineEditor(); return; } // i link li gestisce epub.js
        var el = t ? inlineBlockFrom(t) : null;
        if (!el) {
          // Fallback: se il click cade fuori dal blocco (es. selezione a
          // cavallo di due paragrafi) usa la selezione corrente
          var sel = doc.getSelection ? doc.getSelection() : null;
          if (sel && sel.rangeCount && !sel.isCollapsed) {
            el = inlineBlockFrom(sel.getRangeAt(0).startContainer);
          }
        }
        if (!el) { closeInlineEditor(); return; }
        openInlineEditor(contents, el, e, false);            // prepara senza mostrare
      });
    }

    // Prepara (o mostra, se show !== false) l'editor in-context sul blocco
    // dato. ev e' opzionale: senza evento mouse il popover viene posizionato
    // sotto il testo selezionato o, in ultima istanza, nell'angolo della view.
    function openInlineEditor(contents, el, ev, show) {
      var section = book.spine ? book.spine.spineItems[contents.sectionIndex] : null;
      if (!section) return;
      var cfi = null;
      try { cfi = section.cfiFromElement(el); } catch (err) { cfi = null; }
      var px = null, py = null;
      if (ev && typeof ev.clientX === "number") { px = ev.clientX; py = ev.clientY; }
      else {
        try {
          var sel = contents.document.getSelection();
          var r = sel && sel.rangeCount ? sel.getRangeAt(0).getBoundingClientRect() : null;
          if (r && r.width + r.height > 0) { px = r.right; py = r.bottom; }
        } catch (e) { /* coordinate non disponibili */ }
        if (px == null) { px = 120; py = 120; }
      }
      inlineCtx = {
        doc: contents.document,
        element: el,
        section: section,
        href: section.href,
        archPath: chapterArchPath(section, section.href),
        cfi: cfi,
        px: px,
        py: py
      };
      ieSave.disabled = false; // riabilita il pulsante tra un salvataggio e l'altro
      // Nodi TESTO del paragrafo + snapshot originale (per ripristinare il
      // DOM live alla chiusura senza salvataggio)
      inlineCtx.textNodes = collectTextNodes(el);
      inlineCtx.origFrags = inlineCtx.textNodes.map(function (n) { return n.nodeValue; });
      // Snapshot COMPLETO (anche nodi bianchi): gli estremi di una selezione
      // possono cadere su nodi esclusi da collectTextNodes; il ripristino alla
      // chiusura deve coprirli tutti.
      inlineCtx.allTextNodes = collectAllTextNodes(el);
      inlineCtx.origAll = inlineCtx.allTextNodes.map(function (n) { return n.nodeValue; });
      // Span ESATTO della selezione (nodi+offset), catturato PRIMA di ogni
      // spostamento di focus che potrebbe svuotare la selezione del documento.
      inlineCtx.selSpan = captureSelectionSpan(contents, el, ev);
      // Nodo testo cliccato (dal caret della selezione o dal target del click)
      inlineCtx.fragIndex = clickedTextNodeIndex(inlineCtx.textNodes, contents, el, ev);
      // HTML grezzo del paragrafo: usato solo in modalita' "Intero"
      var html = "";
      try { html = el.outerHTML; } catch (e) { html = new XMLSerializer().serializeToString(el); }
      ieCode.value = html.replace(/\s*[\r\n]+\s*/g, " ");
      setInlineMode(inlineCtx.textNodes.length ? "frag" : "full");
      positionInlineEditor(px, py);
      if (show !== false) {
        inlineEditor.setAttribute("aria-hidden", "false");
        inlineEditor.classList.add("open");
        focusInlineField();
        autoGrowVisibleFrags(); // il popover ora e' visibile: adatta l'altezza
      }
    }

    // Raccoglie i nodi testo non vuoti sotto el (TreeWalker), escludendo
    // script/style. Solo questi verranno modificati al salvataggio: la
    // struttura HTML del paragrafo resta intatta per costruzione.
    function collectTextNodes(el) {
      var nodes = [];
      try {
        var walker = el.ownerDocument.createTreeWalker(
          el, NodeFilter.SHOW_TEXT, {
            acceptNode: function (n) {
              var p = n.parentNode;
              var tag = p && ((p.localName || p.tagName || "") + "").toLowerCase();
              if (tag === "script" || tag === "style") return NodeFilter.FILTER_REJECT;
              return /^\S/.test(n.nodeValue || "")
                ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
            }
          });
        while (walker.nextNode()) nodes.push(walker.currentNode);
      } catch (e) {}
      return nodes;
    }

    // Indice del nodo testo cliccato: dal caret della selezione (il click
    // viaggia nel documento iframe, quindi startContainer e' il nodo testo
    // sotto il cursore); fallback: primo nodo testo dentro il target.
    function clickedTextNodeIndex(textNodes, contents, el, ev) {
      try {
        var s = contents.document.getSelection();
        var sc = s && s.rangeCount ? s.getRangeAt(0).startContainer : null;
        var i = sc && sc.nodeType === 3 ? textNodes.indexOf(sc) : -1;
        if (i >= 0) return i;
      } catch (e) {}
      try {
        var t = ev && ev.target;
        while (t) {
          for (var k = 0; k < textNodes.length; k++) {
            if (t === textNodes[k] || (t.contains && t.contains(textNodes[k]))) return k;
          }
          t = t.parentNode;
        }
      } catch (e) {}
      return 0;
    }

    // Tutti i nodi testo del paragrafo SENZA il filtro sugli spazi: serve per
    // gli estremi di una selezione, che possono cadere su nodi bianchi.
    function collectAllTextNodes(el) {
      var nodes = [];
      try {
        var walker = el.ownerDocument.createTreeWalker(
          el, NodeFilter.SHOW_TEXT, {
            acceptNode: function (n) {
              var p = n.parentNode;
              var tag = p && ((p.localName || p.tagName || "") + "").toLowerCase();
              if (tag === "script" || tag === "style") return NodeFilter.FILTER_REJECT;
              return NodeFilter.FILTER_ACCEPT;
            }
          });
        while (walker.nextNode()) nodes.push(walker.currentNode);
      } catch (e) {}
      return nodes;
    }

    // Converte un estremo di Range (nodo, offset) nel punto testo equivalente
    // della lista ordinata "all": se il contenitore e' un elemento, prende il
    // primo testo che inizia a o dopo il punto (start) / l'ultimo che finisce
    // prima (end). Costanti Range: START_TO_START=0, END_TO_END=2.
    function normTextPoint(doc, all, container, offset, isEnd) {
      if (container.nodeType === 3) {
        return all.indexOf(container) >= 0 ? { n: container, o: offset } : null;
      }
      var probe = doc.createRange();
      try {
        if (isEnd) probe.setEnd(container, offset);
        else probe.setStart(container, offset);
      } catch (err) { return null; }
      for (var i = 0; i < all.length; i++) {
        var tn = all[i];
        var tp = doc.createRange();
        try { tp.selectNodeContents(tn); } catch (e2) { continue; }
        var cmp = probe.compareBoundaryPoints(isEnd ? 2 : 0, tp);
        if (!isEnd && cmp <= 0) return { n: tn, o: 0 };
        if (isEnd && cmp >= 0) return { n: tn, o: (tn.nodeValue || "").length };
      }
      return null;
    }

    // Cattura la selezione corrente del documento iframe come SPAN ESATTO:
    // nodi testo + offset di inizio/fine e stringa selezionata. Null se la
    // selezione e' vuota, fuori dal paragrafo o senza testo utile. Gli estremi
    // fuori dal blocco vengono clampati ai bordi del paragrafo stesso.
    function captureSelectionSpan(contents, el, ev) {
      try {
        var doc = contents.document;
        var sel = doc.getSelection();
        var r = (sel && sel.rangeCount && !sel.isCollapsed) ? sel.getRangeAt(0) : null;
        // Mobile: la selezione e' stata gia' collassata dal tap. Se esiste una
        // selezione salvata da selectionchange e il punto del click cade DENTRO
        // quella selezione, usiamo quella invece di rinunciare al frammento.
        if (!r && ev && typeof ev.clientX === "number") {
          var saved = doc.__lastSelRange;
          if (saved) {
            var pt = null;
            try {
              // La selezione salvata deve riguardare QUESTO paragrafo...
              if (!(saved.startContainer === el || el.contains(saved.startContainer))) { saved = null; }
            } catch (e2) { saved = null; }
          }
          if (saved) {
            try {
              // Punto esatto del tap (se ricavabile): basta che cada dentro
              // la selezione salvata O nel suo bounding rect (margine 12px
              // per imprecisione del tocco e maniglie di selezione).
              if (doc.caretRangeFromPoint) pt = doc.caretRangeFromPoint(ev.clientX, ev.clientY);
              else if (doc.caretPositionFromPoint) {
                var cp = doc.caretPositionFromPoint(ev.clientX, ev.clientY);
                if (cp) { pt = doc.createRange(); pt.setStart(cp.offsetNode, cp.offset); pt.collapse(true); }
              }
              var hit = false;
              try { if (pt && saved.comparePoint(pt.startContainer, pt.startOffset) === 0) hit = true; } catch (e3) {}
              if (!hit) {
                var rc = saved.getBoundingClientRect();
                var M = 12;
                if (rc && rc.width + rc.height > 0 &&
                    ev.clientX >= rc.left - M && ev.clientX <= rc.right + M &&
                    ev.clientY >= rc.top - M && ev.clientY <= rc.bottom + M) hit = true;
              }
              if (hit) r = saved;
            } catch (e4) {}
          }
        }
        if (!r) return null;
        var sc = r.startContainer, so = r.startOffset;
        var ec = r.endContainer, eo = r.endOffset;
        var inS = sc === el || el.contains(sc);
        var inE = ec === el || el.contains(ec);
        if (!inS && !inE) return null;             // selezione altrove
        if (!inS) { sc = el; so = 0; }             // parte prima del paragrafo
        if (!inE) { ec = el; eo = el.childNodes ? el.childNodes.length : 0; } // finisce dopo
        var all = collectAllTextNodes(el);
        if (!all.length) return null;
        var s = normTextPoint(doc, all, sc, so, false);
        var e = normTextPoint(doc, all, ec, eo, true);
        if (!s || !e) {
          // Ultimo fallback (mobile): nessuna selezione recuperabile, ma dal
          // punto del tap conosciamo il caret -> estraiamo la FRASE cliccata.
          // Non dipende da eventi di selezione, quindi funziona anche dopo
          // che il browser ha collassato/svuotato la selezione o l'ha
          // "consumata" col menu Copia/Traduci.
          var sent = captureSentenceAtPoint(doc, all, ev, el);
          if (sent) return sent;
          return null;
        }
        var si = all.indexOf(s.n), ei = all.indexOf(e.n);
        if (si > ei || (si === ei && e.o <= s.o)) return null; // span degenerato
        var parts = [];
        for (var i = si; i <= ei; i++) {
          var v = all[i].nodeValue || "";
          var seg = v.slice(i === si ? s.o : 0, i === ei ? e.o : v.length);
          if (seg) parts.push(seg);
        }
        var text = parts.join("").replace(/\s*[\r\n]+\s*/g, " ");
        if (!text.trim()) return null;
        return { sNode: s.n, sOff: s.o, eNode: e.n, eOff: e.o, text: text };
      } catch (err) { return null; }
    }

    // Estrae la frase di testo cliccata usando SOLO le coordinate del tap:
    // trova il caret, poi espande ai confini di frase (.!?… seguito da spazio/
    // fine) dentro lo stesso nodo testo. Ritorna lo stesso formato dello span
    // di selezione ({ sNode, sOff, eNode, eOff, text }) cosi' l'editing e il
    // salvataggio restano identici.
    function captureSentenceAtPoint(doc, all, ev, el) {
      try {
        var pt = null;
        if (ev && typeof ev.clientX === "number") {
          if (doc.caretRangeFromPoint) pt = doc.caretRangeFromPoint(ev.clientX, ev.clientY);
          else if (doc.caretPositionFromPoint) {
            var cp = doc.caretPositionFromPoint(ev.clientX, ev.clientY);
            if (cp) { pt = doc.createRange(); pt.setStart(cp.offsetNode, cp.offset); pt.collapse(true); }
          }
        }
        if (!pt || pt.startContainer.nodeType !== 3) return null;
        var tn = pt.startContainer;
        if (!(tn === el || el.contains(tn))) return null;
        var txt = String(tn.nodeValue || "");
        var i = Math.min(Math.max(pt.startOffset, 0), txt.length);
        // Se il tap e' subito dopo un terminatore, arretra sull'ultima parola
        while (i > 0 && /[.!?…\s]/.test(txt[i - 1]) && !/[.!?…]/.test(txt[i] || "")) i--;
        var a = i, b = i;
        while (a > 0 && !/[.!?…]\s/.test(txt.slice(Math.max(0, a - 2), a)) ) {
          if (a > 1 && /[.!?…]/.test(txt[a - 2]) && /\s/.test(txt[a - 1])) { a--; break; }
          a--;
        }
        var n = txt.length;
        while (b < n) {
          if (b >= 1 && /[.!?…]/.test(txt[b - 1]) && (/\s/.test(txt[b]) || b === n)) break;
          if (b === n - 1 && /[.!?…]/.test(txt[b])) { b++; break; }
          b++;
        }
        while (a < b && /\s/.test(txt[a])) a++;      // taglia spazi ai bordi
        while (b > a && /\s/.test(txt[b - 1])) b--;
        if (b - a < 1) return null;
        return { sNode: tn, sOff: a, eNode: tn, eOff: b, text: txt.slice(a, b) };
      } catch (err) { return null; }
    }

    // Testo CORRENTE dello span letto dal DOM live (offsets aggiornati da
    // applySelField restano coerenti con i nodeValue mutati).
    function currentSpanText(sp) {
      try {
        var all = inlineCtx.allTextNodes || [];
        var si = all.indexOf(sp.sNode), ei = all.indexOf(sp.eNode);
        if (si < 0 || ei < 0) return "";
        var parts = [];
        for (var i = si; i <= ei; i++) {
          var v = all[i].nodeValue || "";
          parts.push(v.slice(i === si ? sp.sOff : 0, i === ei ? sp.eOff : v.length));
        }
        return parts.join("").replace(/\s*[\r\n]+\s*/g, " ");
      } catch (e) { return ""; }
    }

    // Modalita' del popover: "frag" = solo il pezzo cliccato, "full" =
    // l'intero paragrafo in HTML (come prima). Da frammento a intero applica
    // l'edit corrente al nodo testo, cosi' resta nella serializzazione.
    function setInlineMode(mode) {
      if (!inlineCtx) return;
      var hasFrags = !!(inlineCtx.textNodes && inlineCtx.textNodes.length);
      if (mode === "full" && inlineCtx.mode === "frag" && hasFrags) applyFragField();
      inlineCtx.mode = hasFrags ? mode : "full";
      document.getElementById("ieModeFrag").classList.toggle("active", inlineCtx.mode === "frag");
      document.getElementById("ieModeFull").classList.toggle("active", inlineCtx.mode === "full");
      if (inlineCtx.mode === "frag" && hasFrags) {
        renderFragField();
        ieFrags.style.display = "flex";
        ieCode.style.display = "none";
        autoGrowVisibleFrags(); // se il popover e' gia' visibile, adatta l'altezza
      } else {
        // Intero (o paragrafo senza nodi testo): HTML grezzo come prima
        ieFrags.style.display = "none";
        ieCode.style.display = "block";
        try {
          ieCode.value = inlineCtx.element.outerHTML.replace(/\s*[\r\n]+\s*/g, " ");
        } catch (e) {}
      }
    }

    // Un SOLO campo: lo span ESATTO della selezione (se presente), altrimenti
    // il nodo testo cliccato per intero. Gli altri pezzi restano invisibili.
    function renderFragField() {
      ieFrags.innerHTML = "";
      var row = document.createElement("div");
      row.className = "fragItem";
      var idx = document.createElement("span");
      idx.className = "fragIdx";
      var ta = document.createElement("textarea");
      ta.className = "ieFrag";
      ta.spellcheck = false;
      if (inlineCtx.selSpan) {
        // Selezione trascinata: solo i caratteri evidenziati, anche se
        // attraversano tag inline (i/b/em...): gli estremi sono nodo+offset.
        ta.dataset.span = "1";
        delete ta.dataset.fragIndex;
        ta.value = currentSpanText(inlineCtx.selSpan);
        idx.textContent = "sel \u00b7 " + ta.value.length + " car.";
      } else {
        var i = inlineCtx.fragIndex || 0;
        var node = inlineCtx.textNodes[i];
        delete ta.dataset.span;
        ta.dataset.fragIndex = String(i);
        ta.value = String(node.nodeValue || "").replace(/\s*[\r\n]+\s*/g, " ");
        idx.textContent = (i + 1) + "/" + inlineCtx.textNodes.length;
      }
      autoGrowFrag(ta);
      ta.addEventListener("input", function () { autoGrowFrag(ta); });
      row.appendChild(idx);
      row.appendChild(ta);
      ieFrags.appendChild(row);
    }

    // Riscrive il valore del campo nel DOM live: per lo span distribuisce la
    // stringa modificata su head/testa e coda dei nodi toccati, senza mai
    // toccare la struttura HTML.
    function applyFragField() {
      var ta = ieFrags.querySelector("textarea.ieFrag");
      if (!ta || !inlineCtx) return;
      var val = ta.value.replace(/\s*[\r\n]+\s*/g, " ");
      if (ta.dataset && ta.dataset.span === "1") { applySelField(val); return; }
      if (!inlineCtx.textNodes) return;
      var node = inlineCtx.textNodes[parseInt(ta.dataset.fragIndex, 10) || 0];
      if (node) {
        try { node.nodeValue = val; } catch (e) {}
      }
    }

    // Scrive la stringa editata DENTRO lo span selezionato: head resta prima,
    // tail resta dopo, l'edited occupa esattamente lo spazio della selezione
    // (anche su piu' nodi: i nodi intermedi coperti vengono svuotati).
    // Aggiorna selSpan in modo che una seconda applicazione sia idempotente.
    function applySelField(edited) {
      var sp = inlineCtx.selSpan;
      if (!sp || !sp.sNode) return;
      var sN = sp.sNode, eN = sp.eNode;
      var head = String(sN.nodeValue || "").slice(0, sp.sOff);
      var tail = String((sN === eN ? sN : eN).nodeValue || "").slice(sp.eOff);
      try {
        if (sN === eN) {
          sN.nodeValue = head + edited + tail;
        } else {
          sN.nodeValue = head + edited;   // tutto l'edited vive nel nodo iniziale
          var all = inlineCtx.allTextNodes || [];
          var si = all.indexOf(sN), ei = all.indexOf(eN);
          for (var k = si + 1; k < ei; k++) { if (all[k]) all[k].nodeValue = ""; }
          eN.nodeValue = tail;
          sp.eNode = sN;                  // lo span ora sta tutto in sN
        }
        sp.sOff = head.length;
        sp.eOff = head.length + edited.length;
        sp.text = edited;
      } catch (e) {}
    }

    // Focus + cursore in fondo al campo attivo (frammento o HTML intero)
    function focusInlineField() {
      var f = (inlineCtx && inlineCtx.mode === "frag")
        ? ieFrags.querySelector("textarea.ieFrag")
        : ieCode;
      if (!f) return;
      f.focus();
      if (f.setSelectionRange) f.setSelectionRange(f.value.length, f.value.length);
    }

    // Altezza del campo frammento in funzione del contenuto: una riga minima,
    // cresce fino a 12 righe (oltre, scrolla). Se il popover e' ancora nascosto
    // (display:none sull'antenato) scrollHeight non e' affidabile: in quel caso
    // salta, il ricalcolo avviene con autoGrowVisibleFrags alla visibilita'.
    function autoGrowFrag(ta) {
      if (!ta.closest("#inlineEditor.open")) return;
      ta.style.height = "auto";
      var lh = parseFloat(getComputedStyle(ta).lineHeight) || 18;
      var h = Math.min(Math.max(ta.scrollHeight, lh * 1.6), lh * 12);
      ta.style.height = h + "px";
    }

    // Ricalcola l'altezza dei campi frammento DOPO che il popover e' diventato
    // visibile (il layout deve essere rifatto prima di misurare scrollHeight).
    function autoGrowVisibleFrags() {
      requestAnimationFrame(function () {
        var tas = ieFrags.querySelectorAll("textarea.ieFrag");
        for (var i = 0; i < tas.length; i++) autoGrowFrag(tas[i]);
      });
    }

    // Posiziona il popover in coordinate della pagina madre; quando e' ancora
    // invisibile (preparato) usa dimensioni stimate per il clamp.
    function positionInlineEditor(px, py) {
      var ifr = inlineCtx ? iframeForDoc(inlineCtx.doc) : null;
      var rect = ifr ? ifr.getBoundingClientRect() : { left: 0, top: 0, width: 0, height: 0 };
      var w = inlineEditor.offsetWidth || 380;
      var h = inlineEditor.offsetHeight || 220;
      var x = Math.max(8, Math.min(rect.left + px + 14, window.innerWidth - w - 8));
      var y = Math.max(8, Math.min(rect.top + py + 14, window.innerHeight - h - 8));
      inlineEditor.style.left = x + "px";
      inlineEditor.style.top = y + "px";
    }

    function closeInlineEditor() {
      inlineEditor.classList.remove("open");
      inlineEditor.setAttribute("aria-hidden", "true");
      if (ieFrags.contains(document.activeElement)) document.activeElement.blur();
      if (document.activeElement === ieCode) ieCode.blur(); // toglie il focus da un elemento nascosto
      // Ripristino protetto: se inlineCtx e' gia' null (doppia chiusura,
      // es. Salva + evento "relocated") non c'e' nulla da ripristinare.
      var rn = null, rv = null;
      if (inlineCtx) {
        if (inlineCtx.allTextNodes && inlineCtx.origAll) {
          rn = inlineCtx.allTextNodes; rv = inlineCtx.origAll;
        } else if (inlineCtx.textNodes && inlineCtx.origFrags) {
          rn = inlineCtx.textNodes; rv = inlineCtx.origFrags;
        }
      }
      if (rn && rv) {
        for (var i = 0; i < rn.length; i++) {
          try { rn[i].nodeValue = rv[i]; } catch (e) {}
        }
      }
      ieFrags.innerHTML = "";
      ieCode.style.display = "none";
      document.getElementById("ieModeFrag").classList.remove("active");
      document.getElementById("ieModeFull").classList.remove("active");
      inlineCtx = null;
    }

    // Patch dell'archive in memoria: per quel path il prossimo request
    // restituisce il testo aggiornato (stessa tecnica di updateChapterDom)
    // cosi' il ri-render non rilegge il vecchio contenuto.
    function patchArchiveForChapter(archPath, newText) {
      if (!book || !book.archive) return;
      var archive = book.archive;
      var origRequest = archive.request.bind(archive);
      archive.request = function (url, type) {
        var p = window.decodeURIComponent(String(url).substr(1));
        if (p === archPath) {
          if (!type) {
            var m = /\.([a-z0-9]+)$/i.exec(String(url));
            type = m ? m[1].toLowerCase() : "";
          }
          try {
            return Promise.resolve(archive.handleResponse(newText, type));
          } catch (e) {
            return Promise.resolve(newText);
          }
        }
        return origRequest(url, type);
      };
    }

    // Converte l'HTML inserito dall'utente in un ARRAY di nodi nel namespace
    // XHTML (TUTTI gli elementi di primo livello digitati, non solo il primo:
    // così si può spezzare un paragrafo in due o accodarne altri).
    // Prima prova il parsing XML rigoroso; se fallisce (es. <br>, <img>, <li>
    // non autochiusi, & non escapato) usa il parser HTML tollerante e
    // rinomina gli elementi nel namespace XHTML. La serializzazione finale
    // (outerHTML su documento XML) escape sempre &, <, >. Ritorna [] se
    // l'HTML non produce alcun elemento.
    function parseUserHtml(newHtml, doc) {
      var XHTML_NS = "http://www.w3.org/1999/xhtml";
      var nodes = [];
      // 1) Parsing XML rigoroso (XHTML)
      var xdoc = new DOMParser().parseFromString(
        '<div xmlns="' + XHTML_NS + '">' + newHtml + "</div>",
        "application/xhtml+xml");
      if (!xdoc.getElementsByTagName("parsererror").length) {
        // Tutti i figli di primo livello del wrapper (elementi + testo non
        // bianco): si salvano anche i paragrafi aggiunti dopo il primo.
        for (var i = 0; i < xdoc.documentElement.childNodes.length; i++) {
          var cn = xdoc.documentElement.childNodes[i];
          if (cn.nodeType === 3 && !cn.nodeValue.replace(/\s/g, "")) continue;
          nodes.push(doc.importNode(cn, true));
        }
        if (nodes.length) return nodes;
      }
      // 2) Parsing HTML tollerante + rinominazione nel namespace XHTML
      var hdoc = new DOMParser().parseFromString("<div>" + newHtml + "</div>", "text/html");
      var wrapper = hdoc.body ? hdoc.body.firstElementChild : null;
      if (!wrapper) return [];
      function rebuild(srcNode) {
        var node;
        if (srcNode.nodeType === 1) {
          // <svg>/<math> mantengono il loro namespace, il resto va in XHTML
          var ns = (srcNode.namespaceURI && srcNode.namespaceURI !== XHTML_NS)
            ? srcNode.namespaceURI : XHTML_NS;
          node = doc.createElementNS(ns, srcNode.localName);
          for (var i = 0; i < srcNode.attributes.length; i++) {
            var a = srcNode.attributes[i];
            if (a.namespaceURI) node.setAttributeNS(a.namespaceURI, a.name, a.value);
            else node.setAttribute(a.name, a.value);
          }
          for (var j = 0; j < srcNode.childNodes.length; j++) {
            var kid = rebuild(srcNode.childNodes[j]);
            if (kid) node.appendChild(kid);
          }
          return node;
        }
        if (srcNode.nodeType === 3) return doc.createTextNode(srcNode.nodeValue);
        if (srcNode.nodeType === 8) return doc.createComment(srcNode.nodeValue);
        return null;
      }
      for (var j = 0; j < wrapper.childNodes.length; j++) {
        var n = rebuild(wrapper.childNodes[j]);
        if (n) nodes.push(n);
      }
      return nodes;
    }

    // Ricostruisce il capitolo col paragrafo sostituito, partendo dal testo
    // ORIGINALE dell'archive: cosi' NON vengono salvati gli stili inline di
    // runtime che epub.js scrive sul body (padding/column-*) ne' il link
    // canonical che inietta nel <head>. Il paragrafo viene localizzato per
    // percorso di indici tra figli-element (identico tra DOM live e documento
    // pulito, dato che epub.js non altera la struttura del DOM).
    function buildEditedChapter(ctx, newHtml) {
      return book.archive.request("/" + ctx.archPath, "text").then(function (origText) {
        var rawText = String(origText || "").replace(/^\uFEFF/, "");
        var cleanText = rawText.replace(/^\s*<\?xml[^>]*\?>\s*/, "");
        var cleanDoc = new DOMParser().parseFromString(cleanText, "application/xhtml+xml");
        if (cleanDoc.getElementsByTagName("parsererror").length) {
          throw new Error("il documento non e' XHTML valido");
        }
        // Percorso (indici tra figli-element) dell'elemento cliccato
        var path = [];
        var el = ctx.element;
        while (el && el.nodeType === 1 && el !== ctx.doc.documentElement) {
          var parent = el.parentNode;
          var idx = -1;
          if (parent) {
            var kids = parent.children;
            for (var i = 0; i < kids.length; i++) {
              if (kids[i] === el) { idx = i; break; }
            }
          }
          path.unshift(idx);
          el = parent;
        }
        var target = cleanDoc.documentElement;
        for (var j = 0; j < path.length && target; j++) {
          target = target.children[path[j]];
        }
        if (!target) throw new Error("elemento non trovato nel documento originale");
        // Nuovi nodi dall'HTML inserito: parsing XHTML rigoroso con fallback
        // HTML tollerante (vedi parseUserHtml). L'array contiene TUTTI gli
        // elementi di primo livello digitati dall'utente; vengono inseriti
        // tutti nella posizione dell'elemento originale, quindi si puo'
        // spezzare un paragrafo in due (<p>a</p><p>b</p>) oppure accodare
        // nuovi paragrafi dopo quello editato.
        var nodes = parseUserHtml(newHtml, cleanDoc);
        if (!nodes || !nodes.length) throw new Error("HTML non valido: " + newHtml);
        var frag = cleanDoc.createDocumentFragment();
        for (var k = 0; k < nodes.length; k++) frag.appendChild(nodes[k]);
        target.parentNode.replaceChild(frag, target);
        // Serializza conservando il preambolo originale (<?xml?>, <!DOCTYPE>, commenti)
        var m = /\<html[\s>]/i.exec(rawText);
        var prefix = m ? rawText.substring(0, m.index) : "";
        var out = prefix + cleanDoc.documentElement.outerHTML;
        if (!/\<html\b[^>]*\bxmlns\s*=/i.test(out)) {
          out = out.replace(/<html([ >])/i, '<html xmlns="http://www.w3.org/1999/xhtml"$1');
        }
        return out;
      });
    }

    ieSave.addEventListener("click", function () {
      if (!inlineCtx || !book || !currentBookUrl) return;
      var ctx = inlineCtx;
      // Modalita' frammento: applica l'edit al SUO nodo testo e riserializza
      // il paragrafo dal DOM live (tag e attributi restano intatti).
      if (ctx.mode !== "full" && ctx.textNodes && ctx.textNodes.length) {
        applyFragField();
        try {
          ieCode.value = ctx.element.outerHTML.replace(/\s*[\r\n]+\s*/g, " ");
        } catch (e) {}
      }
      var newHtml = ieCode.value.trim();
      if (!newHtml) { setStatus("HTML vuoto: inserisci un elemento."); return; }
      ieSave.disabled = true;
      buildEditedChapter(ctx, newHtml)
        .then(function (newChapter) {
          // Persistenza sul disco (.epub o cartella) senza MessageBox / re-render automatico
          return apiSaveChapter({
            book: bookKey(),
            href: ctx.archPath,
            content: newChapter,
            silent: true
          }).then(function (res) {
            if (!res || !res.ok) throw new Error((res && res.error) || "salvataggio fallito");
            return newChapter;
          });
        })
        .then(function (newChapter) {
          // 1) Archive in memoria aggiornato: il documento del viewer riflette
          //    la modifica ad ogni futuro re-render
          patchArchiveForChapter(ctx.archPath, newChapter);
          // 2) Sincronizza l'editor full-chapter (tab Modifica HTML)
          if (currentHref && ctx.href &&
              currentHref.split("#")[0] === ctx.href.split("#")[0]) {
            document.getElementById("codeEditor").value = newChapter;
          }
          // 3) Invalida la cache della sezione: Section.load() fa cache del
          //    documento parsato (this.contents); senza questo il ri-render
          //    riuserebbe il contenuto VECCHIO ignorando l'archive patchato.
          if (ctx.section) {
            ctx.section.contents = undefined;
            ctx.section.document = undefined;
            ctx.section.output = undefined;
          }
          closeInlineEditor();
          setStatus("Paragrafo aggiornato ✓");
          // 4) Ri-render del viewer dal contenuto aggiornato, riposizionato
          //    sul paragrafo. clear() e' necessario: con la sezione gia'
          //    visibile display() non ricarica il documento.
          if (rendition) {
            rendition.clear();
            rendition.display(ctx.cfi || ctx.href).catch(function () {});
          }
        })
        .catch(function (err) {
          ieSave.disabled = false;
          setStatus("Errore: " + (err && err.message ? err.message : err));
        });
    });

    // Toggle delle due modalita' di editing del popover
    document.getElementById("ieModeFrag").addEventListener("click", function () {
      setInlineMode("frag");
      focusInlineField();
    });
    document.getElementById("ieModeFull").addEventListener("click", function () {
      setInlineMode("full");
      focusInlineField();
    });

    ieCancel.addEventListener("click", closeInlineEditor);
    ieClose.addEventListener("click", closeInlineEditor);

    // Trascina il popover dalla maniglia (o dalla barra del titolo) con
    // Pointer Events + capture: gli eventi continuano ad arrivare anche se il
    // puntatore passa sopra l'iframe del viewer. touch-action: none nel CSS
    // fa sì che su touch il gesto non venga interpretato come scroll/pan.
    function makePopoverDraggable(handleEl) {
      handleEl.addEventListener("pointerdown", function (e) {
        if (e.target && e.target.closest && e.target.closest("button")) return;
        e.preventDefault();
        var h = this;
        try { h.setPointerCapture(e.pointerId); } catch (err) {}
        var startX = e.clientX, startY = e.clientY;
        var origLeft = parseFloat(inlineEditor.style.left) || 0;
        var origTop = parseFloat(inlineEditor.style.top) || 0;
        function onMove(ev) {
          // mantiene il popover sempre almeno in parte visibile
          var nx = origLeft + ev.clientX - startX;
          var ny = origTop + ev.clientY - startY;
          nx = Math.max(-inlineEditor.offsetWidth + 120, Math.min(nx, window.innerWidth - 120));
          ny = Math.max(0, Math.min(ny, window.innerHeight - 60));
          inlineEditor.style.left = nx + "px";
          inlineEditor.style.top = ny + "px";
        }
        function onUp() {
          h.removeEventListener("pointermove", onMove);
          h.removeEventListener("pointerup", onUp);
        }
        h.addEventListener("pointermove", onMove);
        h.addEventListener("pointerup", onUp);
      });
    }
    makePopoverDraggable(inlineEditor.querySelector(".ieHead"));
    makePopoverDraggable(document.getElementById("ieHandle"));

    // Ridimensiona il popover dal grip in basso a destra
    // Nota: i minimi qui sotto sono px assoluti (non scalati con --ui-scale):
    // sono la scelta manuale dell'utente durante il drag, quindi non viene
    // imposta una dimensione minima crescente con lo zoom della UI.
    document.getElementById("ieGrip").addEventListener("pointerdown", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var grip = this;
      try { grip.setPointerCapture(e.pointerId); } catch (err) {}
      var startX = e.clientX, startY = e.clientY;
      var origW = inlineEditor.offsetWidth, origH = inlineEditor.offsetHeight;
      function onMove(ev) {
        inlineEditor.style.width =
          Math.min(Math.max(360, origW + ev.clientX - startX), window.innerWidth - 16) + "px";
        inlineEditor.style.height =
          Math.min(Math.max(240, origH + ev.clientY - startY), window.innerHeight - 16) + "px";
      }
      function onUp() {
        grip.removeEventListener("pointermove", onMove);
        grip.removeEventListener("pointerup", onUp);
      }
      grip.addEventListener("pointermove", onMove);
      grip.addEventListener("pointerup", onUp);
    });

    // NOTA: niente "clic fuori = chiudi" per il popover di editing.
    // Un click fuori arrivava solo dalle aree della pagina madre (margine a
    // destra del viewer, toolbar, tab): i click sul libro viaggiano dentro gli
    // iframe di epub.js e NON raggiungono il documento madre, quindi la
    // chiusura avveniva solo a destra del popover (comportamento asimmetrico
    // e incomprensibile). Peggio: chiudere equivaleva ad "Annulla" e le
    // modifiche non salvate andavano perse. Il popover si chiude solo con
    // Annulla / ✕ / Esc / Salva (o al cambio di capitolo/libro/tab).

    // All'avvio carica l'elenco dei libri serviti da Flask
    loadBookList();

    // PWA: registrazione service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
